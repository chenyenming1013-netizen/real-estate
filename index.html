<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>地產實習生：買房實戰訓練</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbf7ef; --card:#ffffff; --ink:#1f2a44; --muted:#6f6a60; --line:#e6ddcc;
  --red:#d7263d; --yellow:#ffd23f; --green:#17805a; --blue:#2f5bd3; --soft:#f3ecdf;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --paper:#15171c; --card:#1e2128; --ink:#eef0f5; --muted:#a3a19a; --line:#2f333c; --soft:#262a32; --green:#3fbf8c; --blue:#7a9cff; } }
:root[data-theme="dark"]{ --paper:#15171c; --card:#1e2128; --ink:#eef0f5; --muted:#a3a19a; --line:#2f333c; --soft:#262a32; --green:#3fbf8c; --blue:#7a9cff; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.55}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.n{font-family:"Barlow Condensed","Noto Sans TC",sans-serif;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}
a{color:var(--blue)}

header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) header{background:#0c0e12} }
.brand{display:flex;align-items:center;gap:10px}
.sale{width:44px;height:44px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:900;font-size:26px;border-radius:4px;transform:rotate(-4deg);box-shadow:3px 3px 0 var(--yellow)}
.brand b{font-size:20px;font-weight:900;display:block;line-height:1.1}
.brand small{font-size:12px;color:#c9cbd3}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-left:auto;align-items:center}
.stat{display:flex;flex-direction:column;line-height:1.1}
.stat span{font-size:11px;color:#b8bcc8}
.stat b{font-size:22px}
.stat b.pos{color:#7fe0b0} .stat b.neg{color:#ff8a95}
#nextBtn{background:var(--yellow);color:#1f2a44;border:0;font-weight:900;padding:10px 16px;border-radius:6px;font-size:15px;box-shadow:0 3px 0 #b8910b}
#nextBtn:active{transform:translateY(2px);box-shadow:0 1px 0 #b8910b}

nav{display:flex;gap:4px;padding:10px 16px 0;max-width:1280px;margin:0 auto;border-bottom:2px solid var(--line);flex-wrap:wrap;align-items:flex-end}
nav button{background:none;border:0;padding:8px 14px 10px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}
nav .ai{margin-left:auto;font-size:12px;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--muted);margin-bottom:8px}
nav .ai.on{background:#e6f5ee;color:#17805a}
main{max-width:1280px;margin:0 auto;padding:16px}

.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.seg button{border:2px solid var(--ink);background:var(--card);padding:6px 16px;border-radius:999px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--card);padding:6px 10px;border-radius:8px;text-align:left;line-height:1.2}
.chip b{display:block;font-size:14px}
.chip span{font-size:12px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.up{color:var(--red)} .down{color:var(--green)}

.mk{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.panel h3{margin:0 0 8px;font-size:17px;font-weight:900}
.mapbox{border-radius:10px;overflow:hidden;background:var(--soft);border:1px solid var(--line)}
.mapbox iframe{display:block;width:100%;height:260px;border:0}
.mapfb{padding:22px 16px;text-align:center}
.mapfb .pin{font-size:34px}
.mapfb p{margin:6px 0 12px;color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin-top:10px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-weight:700;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.yel{background:var(--yellow);border-color:var(--yellow);color:#1f2a44}
.btn.sm{padding:5px 10px;font-size:13px;border-width:1.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}

.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.lc{display:grid;grid-template-columns:96px 1fr;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;position:relative}
.lc:hover{border-color:var(--ink)}
.lc svg{width:96px;height:96px;border-radius:8px;display:block}
.lc h4{margin:0;font-size:14px;font-weight:700;line-height:1.35}
.price{font-size:30px;line-height:1;margin:4px 0 2px}
.price small{font-size:14px;font-family:"Noto Sans TC",sans-serif;font-weight:700;margin-left:2px}
.meta{font-size:12px;color:var(--muted)}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.tag{font-size:11px;padding:1px 7px;border-radius:4px;background:var(--soft);color:var(--muted);font-weight:700}
.tag.red{background:var(--red);color:#fff} .tag.yel{background:var(--yellow);color:#1f2a44} .tag.grn{background:var(--green);color:#fff}
.stamp{position:absolute;top:8px;right:10px;border:2px solid var(--red);color:var(--red);font-weight:900;font-size:12px;padding:0 5px;border-radius:3px;transform:rotate(6deg)}

.props{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.pc .top{display:flex;gap:12px}
.pc svg{width:72px;height:72px;border-radius:8px;flex:none}
.pc .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0;font-size:12px;color:var(--muted)}
.pc .grid b{display:block;font-size:19px;color:var(--ink)}
.pc .acts{display:flex;gap:6px;flex-wrap:wrap}
.summary{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.summary div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--muted)}
.summary b{display:block;font-size:24px;color:var(--ink)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.feed{display:flex;flex-direction:column;gap:8px}
.feed .it{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ink);border-radius:8px;padding:8px 12px;font-size:14px}
.feed .it.news{border-left-color:var(--red)}
.feed .it.good{border-left-color:var(--green)}
.feed time{font-size:12px;color:var(--muted);margin-right:8px}

/* modal */
#mw{position:fixed;inset:0;background:rgba(15,18,25,.6);display:none;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 12px 16px;z-index:20;overflow-y:auto}
#mw.open{display:flex}
#md{background:var(--card);color:var(--ink);width:min(760px,100%);border-radius:14px;padding:20px;margin:auto 0;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#md.wide{width:min(1060px,100%)}
#md h2{margin:0 0 4px;font-size:22px;font-weight:900;padding-right:36px}
#md .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:0;background:var(--soft);font-size:18px}
.foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.note{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--muted);line-height:1.6}
.note b{color:var(--ink)}
.warn{background:#fff1f2;color:#9f1239;border-radius:8px;padding:10px 12px;font-size:13px}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .warn{background:#3a1c22;color:#ffb3bd} }
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td{padding:5px 0;border-bottom:1px dashed var(--line)}
table.t td:last-child{text-align:right;font-weight:700}
table.t tr.total td{border-top:2px solid var(--ink);border-bottom:0;font-size:16px;padding-top:8px}

/* steps */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin:0 0 14px;counter-reset:st;padding-right:36px}
.step{position:relative;text-align:center;font-size:12px;color:var(--muted);padding-top:2px}
.step::before{content:'';position:absolute;top:15px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0}
.step:first-child::before{display:none}
.step i{position:relative;z-index:1;display:grid;place-items:center;width:30px;height:30px;margin:0 auto 4px;border-radius:50%;background:var(--soft);border:2px solid var(--line);font-style:normal;font-weight:900;font-family:"Barlow Condensed",sans-serif;font-size:16px;color:var(--muted)}
.step b{display:block;font-size:13px;color:var(--muted)}
.step.done i{background:var(--green);border-color:var(--green);color:#fff}
.step.done::before,.step.cur::before{background:var(--green)}
.step.done b{color:var(--green)}
.step.cur i{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 0 4px rgba(215,38,61,.18)}
.step.cur b{color:var(--ink)}
.steptip{background:var(--soft);border-left:4px solid var(--red);border-radius:6px;padding:8px 12px;font-size:13px;margin:-4px 0 14px;line-height:1.6}
.steptip b{color:var(--red)}
.flow{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px 4px;margin-bottom:14px}
.flow h3{margin:0 0 10px;font-size:15px}
.flow .steps{padding-right:0}
.pending{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff8d6;border:1px solid #f0d36b;border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:14px;color:#5a4a00}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .pending{background:#3a3418;border-color:#6b5a1c;color:#f3e3a0} }
@media (max-width:640px){ .step b{font-size:11px} .step small{display:none} .step i{width:26px;height:26px;font-size:14px} .step::before{top:13px} }
/* glossary & inspection */
button.term{all:unset;cursor:pointer;color:inherit;border-bottom:1.5px dotted var(--blue);font-weight:inherit}
button.term:hover,button.term:focus-visible{color:var(--blue);outline:none;background:rgba(47,91,211,.08)}
#termPop{position:fixed;z-index:50;display:none;background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:10px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-size:14px;line-height:1.6}
#termPop .tp-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
#termPop .tp-h span{font-size:11px;color:var(--muted)}
#termPop p{margin:6px 0 8px}
#termPop .tp-more{border:0;background:none;color:var(--blue);padding:0;font-size:13px;text-decoration:underline}
.gi{border-bottom:1px dashed var(--line);padding:8px 2px}
.gi b{font-size:16px;margin-right:6px}
.gi p{margin:4px 0 0;font-size:14px;line-height:1.65}
details.gi summary{cursor:pointer;padding:4px 0;font-size:16px}
details.gi p{margin:8px 0 0 4px}
table.insp td:first-child{text-align:left;font-weight:400}
table.insp tr:first-child td{font-weight:700;color:var(--muted);font-size:12px}
/* checklist */
.ckhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 8px;font-size:13px;color:var(--muted)}
.ckbar{flex:1 1 160px;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.ckbar i{display:block;height:100%;width:0;background:var(--green);transition:width .25s}
.cklist{max-height:52vh;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:4px 10px}
.ckrow{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);opacity:.45;transition:opacity .2s}
.ckrow.done{opacity:1}
.ckrow:last-child{border-bottom:0}
.ckname{display:flex;flex-direction:column;gap:2px}
.ck{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-size:15px}
.ck.ok{background:#e3f4ec;color:var(--green)} .ck.bad{background:#fde7ea;color:var(--red)} .ck.warn{background:#fff4d6;color:#b07800} .ck.unk{background:#e6edfb;color:var(--blue)} .ck.wait{background:var(--soft);color:var(--muted)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .ck.ok{background:#173a2c} :root:not([data-theme="light"]) .ck.bad{background:#3a1c22} :root:not([data-theme="light"]) .ck.warn{background:#3a3115} :root:not([data-theme="light"]) .ck.unk{background:#1c2744} }
/* chat */
.nego{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px}
.side{display:flex;flex-direction:column;gap:10px}
.avatar{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:22px;color:#fff;background:var(--ink);flex:none}
.who{display:flex;gap:10px;align-items:center}
.who b{font-size:17px}
.meter{height:10px;border-radius:5px;background:var(--soft);overflow:hidden}
.meter i{display:block;height:100%;transition:width .4s,background .4s}
.bigprice{font-size:34px;line-height:1}
.chat{height:340px;overflow-y:auto;background:var(--soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:85%;padding:8px 12px;border-radius:12px;font-size:14px;line-height:1.55;white-space:pre-wrap}
.msg.them{background:var(--card);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:3px}
.msg.me{background:var(--ink);color:var(--paper);align-self:flex-end;border-bottom-right-radius:3px}
.msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:12px;padding:2px}
.msg .off{display:inline-block;margin-top:4px;background:var(--yellow);color:#1f2a44;border-radius:4px;padding:0 6px;font-weight:700;font-size:12px}
.tact{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tact button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px;font-size:13px}
.tact button:hover{border-color:var(--ink)}
.tact button.used{opacity:.45}
.inrow{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.inrow textarea{flex:1 1 260px;min-height:62px;resize:vertical;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:14px;background:var(--card);color:var(--ink)}
.offer{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.offer input{width:130px;font-size:20px;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.terms{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.terms div{background:var(--soft);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--muted)}
.terms b{display:block;font-size:20px;color:var(--ink)}
.banks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.bank{border:2px solid var(--line);border-radius:12px;padding:12px;text-align:left;background:var(--card)}
.bank:hover{border-color:var(--ink)}
.bank b{font-size:17px;display:block}
.bank .k{font-size:12px;color:var(--red);font-weight:700}
.bank p{font-size:13px;color:var(--muted);margin:6px 0 0}
.opt{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer}
.opt:hover{border-color:var(--ink)}
.opt small{display:block;color:var(--muted);font-size:12px}
.opt .n{font-size:18px}
.opt.dis{opacity:.45;cursor:not-allowed}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.mode{border:2px solid var(--line);border-radius:10px;padding:10px;text-align:left;background:var(--card)}
.mode[aria-pressed="true"]{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.mode b{display:block}
.mode small{color:var(--muted);font-size:12px;display:block;line-height:1.45;margin-top:3px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);margin:10px 0}
.field input[type=range]{accent-color:var(--red)}
.field input[type=number]{font-size:18px;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;width:160px;background:var(--card);color:var(--ink)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:10px;font-weight:700;opacity:0;transition:all .3s;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.spark{width:100%;height:90px}
@media (max-width:860px){
  .mk,.two,.nego{grid-template-columns:1fr}
  .stats{gap:12px;margin-left:0;width:100%}
  .stat b{font-size:18px}
  .chat{height:300px}
}

// 自繪行政區房價地圖（不需任何外部服務）＋ OpenStreetMap 免費地圖（僅在自己的網站上內嵌）
function priceMapSVG(ck, sel, clickable){
  const pts = CITIES[ck].dists.map((d,i)=>({i, name:d[0], ll:GEO[ck][d[0]], u:unitNow(ck,i)}));
  const lats = pts.map(p=>p.ll[0]), lngs = pts.map(p=>p.ll[1]);
  const la0=Math.min(...lats), la1=Math.max(...lats), lo0=Math.min(...lngs), lo1=Math.max(...lngs);
  const W=360, H=250, pad=46;
  const sx = (W-pad*2)/Math.max(1e-6,lo1-lo0), sy = (H-pad*2)/Math.max(1e-6,la1-la0), sc=Math.min(sx,sy);
  const ox = (W-(lo1-lo0)*sc)/2, oy = (H-(la1-la0)*sc)/2;
  const X = lo => ox+(lo-lo0)*sc, Y = la => oy+(la1-la)*sc;
  const us = pts.map(p=>p.u), umin=Math.min(...us), umax=Math.max(...us);
  const col = u => { const t=(u-umin)/Math.max(1e-6,umax-umin); const r=Math.round(90+t*125), g=Math.round(170-t*120), b=Math.round(150-t*90); return `rgb(${r},${g},${b})`; };
  let o = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${CITIES[ck].name}各區房價地圖" style="display:block;width:100%;height:auto;background:var(--soft)">`;
  o += `<text x="10" y="18" font-size="11" fill="var(--muted)">圓越大、越紅＝單價越高（萬/坪）</text>`;
  for (const p of pts){
    const x=X(p.ll[1]), y=Y(p.ll[0]), r=14+ (p.u-umin)/Math.max(1e-6,umax-umin)*14, on=p.i===sel;
    o += `<g ${clickable?`class="mapcity" data-dist="${p.i}" tabindex="0" role="button" aria-label="${p.name} ${p.u.toFixed(1)}萬每坪" style="cursor:pointer"`:''}>
      <circle cx="${x}" cy="${y}" r="${r}" fill="${col(p.u)}" opacity="${on?1:0.78}" stroke="${on?'var(--ink)':'#fff'}" stroke-width="${on?3:1.5}"/>
      <text x="${x}" y="${y+4}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" style="font-family:'Barlow Condensed',sans-serif">${p.u.toFixed(0)}</text>
      <text x="${x}" y="${y+r+13}" text-anchor="middle" font-size="12" font-weight="${on?900:700}" fill="var(--ink)">${p.name}</text></g>`;
  }
  return o + `</svg>`;
}
function osmLink(ck, di){ const [la,lo]=GEO[ck][CITIES[ck].dists[di][0]]; return `https://www.openstreetmap.org/#map=15/${la}/${lo}`; }

  setTimeout(()=>initMap(id, ck, di, clickable, road), 0);
  return `<div class="lmap" id="${id}" role="img" aria-label="${CITIES[ck].name}${CITIES[ck].dists[di][0]}地圖"></div>
    <p class="meta" style="margin:6px 0 0" id="${id}n">${road?'正在載入道路資料……':clickable?'點選地圖上的行政區即可切換；顏色越紅代表單價越高。':''}</p>

}
function initMap(id, ck, di, clickable, road){
  const el = document.getElementById(id); if (!el) return;
  if (!window.L){ el.outerHTML = `<div class="mapbox">${priceMapSVG(ck, di, clickable)}</div>`; return; }
  // 不使用街道底圖：只畫行政區界、區內主要道路與標的道路，不會顯示任何建物
  const map = L.map(el, {scrollWheelZoom:false, zoomSnap:0.25, maxZoom:16, minZoom:9, attributionControl:true});
  map.attributionControl.setPrefix(false);
  map.attributionControl.addAttribution('行政區界：內政部國土測繪中心｜道路：© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a>');
  MAPS[id] = {map, scope: road ? 'modal' : 'main'};
  const counties = cityCounties(ck);
  const game = CITIES[ck].dists.map((d,i)=>({i, key:townKey(ck,d[0]), u:unitNow(ck,i)}));
  const us = game.map(g=>g.u), umin=Math.min(...us), umax=Math.max(...us);
  const col = u => { const t=(u-umin)/Math.max(1e-6,umax-umin); return `rgb(${Math.round(90+t*125)},${Math.round(170-t*120)},${Math.round(150-t*90)})`; };
  const sel = townKey(ck, CITIES[ck].dists[di][0]);
  let selLayer = null; const gameLayers = [];
  for (const f of TOWNS){
    if (!counties.includes(f.c)) continue;
    const g = game.find(x=>x.key[0]===f.c && x.key[1]===f.t);
    const isSel = f.c===sel[0] && f.t===sel[1];
    const ll = f.g.map(poly=>poly.map(ring=>ring.map(([x,y])=>[y,x])));
    const style = isSel ? {color:'#d7263d', weight:3.5, fillColor:'#ffd23f', fillOpacity:0.18}
      : g ? {color:'#6f7a80', weight:1.2, fillColor:col(g.u), fillOpacity: road?0.08:0.28}
      : {color:'#b3babe', weight:0.7, fillColor:'#dde1e3', fillOpacity:0.15, interactive:false};
    const layer = L.polygon(ll, style).addTo(map);
    if (g){
      layer.bindTooltip(`${f.t}　${g.u.toFixed(1)} 萬/坪`, {sticky:true});
      if (clickable && !isSel){ layer.on('click', ()=>{ S.dist=g.i; render(); }); layer.on('mouseover', ()=>layer.setStyle({fillOpacity:0.5})); layer.on('mouseout', ()=>layer.setStyle({fillOpacity:0.28})); }
      gameLayers.push(layer);
    }
    if (isSel) selLayer = layer;
  }
  const fit = () => { try{ map.fitBounds((road||!clickable) && selLayer ? selLayer.getBounds() : L.featureGroup(gameLayers).getBounds(), {padding:[6,6]}); }catch(e){ map.setView(GEO[ck][CITIES[ck].dists[di][0]], 12); } };
  fit(); setTimeout(()=>{ map.invalidateSize(); fit(); }, 60);
  if (!selLayer) return;
  if (!road) selLayer.bindTooltip(CITIES[ck].dists[di][0], {permanent:true, direction:'center', className:'distlbl'}).openTooltip();
  const roadPane = map.createPane('roads'); roadPane.style.zIndex = 450; roadPane.style.pointerEvents = 'none';
  const hiPane = map.createPane('hi'); hiPane.style.zIndex = 460;
  const dist = CITIES[ck].dists[di][0];
  const note = () => document.getElementById(id+'n');
  if (!road) return;   // 看房市場只畫行政區界，不查道路，減少對外查詢
  const tryRoad = (attempt) => {
    const n = note(); if (n) n.textContent = attempt ? `重新載入「${road}」道路資料中……` : `正在載入「${road}」道路資料……`;
    loadRoadArea(ck, di, road, selLayer.getBounds()).then(res=>{
      if (!MAPS[id]) return; const n = note();
      if (res && res.major) for (const w of res.major){ const wt = w.k<=1?4:w.k===2?3:2; L.polyline(w.p, {pane:'roads', color:w.k<=1?'#e8a23a':'#9aa3a8', weight:wt, opacity:0.9, interactive:false}).addTo(map); }
      if (res && res.lines && res.lines.length){
        const pl = L.polyline(res.lines, {pane:'hi', color:'#d7263d', weight:7, opacity:0.9, lineCap:'round'}).addTo(map);
        pl.bindTooltip(road, {permanent:true, direction:'top', className:'roadlbl'}).openTooltip();
        if (n) n.textContent = `紅色粗線為${dist}的「${road}」整條道路；地圖不標示任何建物或門牌（物件為虛構）。`;
      } else if (n){
        const why = res && res.err==='none' ? `OpenStreetMap 上查不到「${road}」，地圖僅標示${dist}的行政區界。`
          : res && res.err==='offline' ? '暫時無法連線到道路資料服務，地圖僅標示行政區界。'
          : '道路資料服務目前忙碌，地圖暫時只標示行政區界。';
        n.innerHTML = esc(why) + (res && res.err!=='none' && attempt<3 ? ' <button class="btn sm ghost" type="button">重試</button>' : '') + (res && res.detail ? `<br><small style="opacity:.6">（${esc(res.detail)}）</small>` : '');
        const b = n.querySelector('button'); if (b) b.onclick = () => tryRoad(attempt+1);
      }
    });
  };
  tryRoad(0);
}
// 道路資料：OpenStreetMap Overpass API（只在玩家打開物件時查詢一次；同一次查詢取得標的道路與區內主要道路；結果快取在瀏覽器；間隔至少一秒；主伺服器失敗時改用其他公開鏡像）
const OVERPASS = ['https://overpass-api.de/api/interpreter','https://overpass.private.coffee/api/interpreter'];
let roadLast = 0;
async function overpass(q){
  let detail = '';
  for (const url of OVERPASS){
    const wait = Math.max(0, roadLast + 1100 - Date.now()); roadLast = Date.now() + wait;
    if (wait) await new Promise(r=>setTimeout(r, wait));
    const ctl = ('AbortController' in window) ? new AbortController() : null;
    const tm = ctl ? setTimeout(()=>ctl.abort(), 25000) : 0;
    try{
      const r = await fetch(url + '?data=' + encodeURIComponent(q), {signal: ctl?ctl.signal:undefined});
      clearTimeout(tm);
      if (r.ok) return {data: await r.json()};
      detail = `${new URL(url).host} 回應 ${r.status}`;
    }catch(e){ clearTimeout(tm); detail = `${new URL(url).host}：${e && e.name==='AbortError' ? '逾時' : '連線失敗'}`; }
  }
  return {err: /逾時|429|504|503/.test(detail) ? 'busy' : 'offline', detail};
}
const roadMem = {};
async function loadRoadArea(ck, di, road, b){
  const key = 'roadv3:'+ck+':'+CITIES[ck].dists[di][0]+':'+road;
  if (roadMem[key]) return roadMem[key];
  try{ const v=localStorage.getItem(key); if (v!=null){ roadMem[key]=JSON.parse(v); return roadMem[key]; } }catch(e){}
  const bb = `${(b.getSouth()-0.004).toFixed(4)},${(b.getWest()-0.004).toFixed(4)},${(b.getNorth()+0.004).toFixed(4)},${(b.getEast()+0.004).toFixed(4)}`;
  const nm = road.replace(/[.*+?^${}()|[\]\\"]/g,'');
  const q = `[out:json][timeout:25];(way["highway"]["name"~"^${nm}([一二三四五六七八九十]段)?$"](${bb});way["highway"~"^(motorway|trunk|primary|secondary)$"](${bb}););out geom;`;
  const r = await overpass(q); if (!r.data) return r;
  const rank = {motorway:0,trunk:1,primary:2,secondary:3};
  const lines = [], major = [];
  for (const e of (r.data.elements||[])){
    if (!e.geometry) continue;
    const pts = e.geometry.map(p=>[+p.lat.toFixed(5), +p.lon.toFixed(5)]);
    if (e.tags && e.tags.name && new RegExp('^'+nm+'([一二三四五六七八九十]段)?$').test(e.tags.name)) lines.push(pts);
    else if (e.tags && rank[e.tags.highway]!==undefined) major.push({k:rank[e.tags.highway], p:pts.map(p=>[+p[0].toFixed(4), +p[1].toFixed(4)])});
  }
  const res = lines.length ? {lines, major} : {err:'none', major};
  roadMem[key] = res; try{ localStorage.setItem(key, JSON.stringify(res)); }catch(e){}
  return res;
}

function monthlyLoan(p){ const l=p.loan; if(!l||l.balance<=0) return 0; const m=S.t-l.start; const r=l.rate/100/12; if (m < l.grace*12) return l.balance*r; const left = l.years*12 - m; return left>0 ? pmt(l.balance,l.rate,left/12) : l.balance; }
function existingPayments(){ return S.props.reduce((s,p)=>s+monthlyLoan(p),0); }
function rentIncome(){ return S.props.reduce((s,p)=>s+(p.status==='出租'?p.rent:0),0); }
function mgmtFee(p){ return (p.L.type==='電梯大樓'||p.L.type==='華廈') ? Math.round(p.L.ping*(p.L.ck==='tp'?90:65)) : 0; }
function selfUse(){ return S.props.some(p=>p.status==='自住'); }
function monthlyFlow(){
  let f = S.income - S.living - (selfUse()?0:S.rentHome);
  for (const p of S.props){ f -= monthlyLoan(p) + mgmtFee(p); if (p.status==='出租') f += p.rent; }
  return Math.round(f);
}
function netWorth(){ return S.cash + S.props.reduce((s,p)=>s+valueOf(p.L)-(p.loan?p.loan.balance:0),0); }
function jcicCount(){ return S.jcic.filter(t=>S.t-t<3).length; }
function loanCase(price, L){
  // 依央行歷次選擇性信用管制整理（簡化版）：2010/6、2010/12、2012/6、2014/6、2015/8、2016/3、2020/12、2021/3、2021/9、2021/12、2023/6、2024/6、2024/9、2026/3、2026/9
  const n = S.props.length, a = absOf(S.t), A=(y,m)=>y*12+m-1;
  const hiLine = a>=A(2020,12) ? CITIES[L.ck].high : (L.ck==='tp'?8000:L.ck==='nt'?5000:4000);
  const high = price >= hiLine*10000;
  const maxY1 = a>=A(2023,8) && a<A(2026,8) ? 40 : 30;
  const first = {label:'首購自住（名下無房）', cap:0.8, grace:true, maxY:maxY1};
  const hiLbl = `高價住宅（${CITIES[L.ck].name}總價 ${hiLine} 萬以上）`;
  const nth = `自然人第${n+1}戶`;
  const sp = L.ck==='tp'||L.ck==='nt';   // 2010～2016 的特定地區以雙北為主（簡化）
  let era, r;
  if (a < A(2010,6)){ era='尚未實施選擇性信用管制';
    r = n===0&&!high ? first : {label:high?hiLbl:nth, cap:0.8, grace:true, maxY:30}; }
  else if (a < A(2016,3)){
    era = a<A(2010,12)?'央行2010年6月首波信用管制' : a<A(2012,6)?'央行2010年12月第二波信用管制' : a<A(2014,6)?'央行2012年6月第三波信用管制' : a<A(2015,8)?'央行2014年6月第四波信用管制':'央行2015年8月部分鬆綁後規定';
    const spCap = a<A(2010,12)?0.7 : (a>=A(2014,6)&&a<A(2015,8))?0.5 : 0.6;
    if (high && a>=A(2012,6)) r={label:hiLbl, cap:(a>=A(2014,6)&&a<A(2015,8))?0.5:0.6, grace:false, maxY:30};
    else if (n===0) r=first;
    else if (n>=2 && a>=A(2014,6) && a<A(2015,8)) r={label:`${nth}（全國第三戶以上）`, cap:0.5, grace:false, maxY:30};
    else if (sp) r={label:`特定地區（雙北）${nth}`, cap:spCap, grace:false, maxY:30};
    else r={label:nth, cap:0.8, grace:true, maxY:30}; }
  else if (a < A(2020,12)){ era='2016年3月解除管制，僅保留高價住宅規定';
    r = high?{label:hiLbl,cap:0.6,grace:false,maxY:30} : n===0?first : {label:nth,cap:0.8,grace:true,maxY:30}; }
  else if (a < A(2023,6)){
    era = a<A(2021,3)?'央行2020年12月信用管制' : a<A(2021,9)?'央行2021年3月第二波信用管制' : a<A(2021,12)?'央行2021年9月第三波信用管制':'央行2021年12月第四波信用管制';
    const hiCap = a<A(2021,3)?0.6 : a<A(2021,12)?(n>=3?0.4:0.55) : 0.4;
    const n3Cap = a<A(2021,3)?0.6 : a<A(2021,12)?(n>=3?0.5:0.55) : 0.4;
    if (high) r={label:hiLbl,cap:hiCap,grace:false,maxY:30};
    else if (n===0) r=first;
    else if (n===1) r={label:'自然人第二戶（六都＋新竹）',cap:0.8,grace:a<A(2021,9),maxY:30};
    else r={label:`${nth}（第三戶以上）`,cap:n3Cap,grace:false,maxY:30}; }
  else if (a < A(2024,9)){ era = a<A(2024,6)?'央行2023年6月第五波信用管制':'央行2024年6月第六波信用管制';
    r = high?{label:hiLbl,cap:0.4,grace:false,maxY:30} : n===0?first : n===1?{label:'自然人第二戶（六都＋新竹）',cap:a>=A(2024,6)?0.6:0.7,grace:false,maxY:30} : {label:`${nth}（第三戶以上）`,cap:0.4,grace:false,maxY:30}; }
  else { era = a<A(2026,2)?'央行2024年9月第七波信用管制' : a<A(2026,8)?'央行2026年3月調整後規定':'央行2026年9月調整後規定';
    const c2 = a>=A(2026,8)?0.7 : a>=A(2026,2)?0.6 : 0.5;
    r = high?{label:hiLbl,cap:0.3,grace:false,maxY:30} : n===0?first : n===1?{label:'自然人第二戶（全國）',cap:c2,grace:false,maxY:30} : {label:`${nth}（第三戶以上）`,cap:0.3,grace:false,maxY:30}; }
  r = {...r, maxY: Math.min(r.maxY, Math.max(20, Math.floor((75 - pAge())/5)*5))};
  return {...r, era};
}

function stepper(cur, withTip=true){
  return `<div class="steps" aria-label="購屋流程：第 ${cur} 步，共 5 步">${STEPS.map((st,i)=>{ const n=i+1; const c = n<cur?'done':n===cur?'cur':''; return `<div class="step ${c}"><i>${n<cur?'✓':n}</i><b>${st.t}</b></div>`; }).join('')}</div>`
    + (withTip?`<div class="steptip"><b>Step ${cur}　${STEPS[cur-1].t}</b>：${STEPS[cur-1].tip}</div>`:'');
}

const GLOSS_MAP = new Map(GLOSSARY.map(g=>[g[0],g]));
const GLOSS_ALIAS = {'代書':'地政士','偵煙器':'住宅用火災警報器','仲介費':'仲介服務費','服務費':'仲介服務費','信用管制':'選擇性信用管制','新青安貸款':'新青安'};
const GLOSS_TERMS = [...GLOSS_MAP.keys(), ...Object.keys(GLOSS_ALIAS)].sort((a,b)=>b.length-a.length);
const GLOSS_RE = new RegExp('(' + GLOSS_TERMS.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|') + ')');
function termify(root){
  if (!root) return;
  const targets = root.querySelectorAll('.steptip, .note, .desc, .warn, .kv dd, .kv dt, table.t td:first-child, .modes small, .msg.sys');
  targets.forEach(el=>{
    if (el.dataset.termified) return; el.dataset.termified='1';
    const seen = new Set();
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, {acceptNode:n=> n.parentElement && n.parentElement.closest('button,a,input,textarea,select,.term') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
    const nodes=[]; while (walker.nextNode()) nodes.push(walker.currentNode);
    for (const n of nodes){
      let txt = n.nodeValue; if (!GLOSS_RE.test(txt)) continue;
      const frag = document.createDocumentFragment(); let m;
      while ((m = txt.match(GLOSS_RE))){
        const term = m[1], i = m.index;
        frag.appendChild(document.createTextNode(txt.slice(0,i)));
        const key = GLOSS_ALIAS[term] || term;
        if (seen.has(key)) frag.appendChild(document.createTextNode(term));
        else { seen.add(key); const b=document.createElement('button'); b.type='button'; b.className='term'; b.dataset.term=key; b.textContent=term; frag.appendChild(b); }
        txt = txt.slice(i+term.length);
      }
      frag.appendChild(document.createTextNode(txt));
      n.parentNode.replaceChild(frag, n);
    }
  });
}
let termPop = null;
function showTerm(key, anchor){
  const g = GLOSS_MAP.get(key); if (!g) return;
  if (!termPop){ termPop=document.createElement('div'); termPop.id='termPop'; termPop.setAttribute('role','dialog'); document.body.appendChild(termPop); }
  termPop.innerHTML = `<div class="tp-h"><b>${esc(g[0])}</b><span>${esc(g[1])}</span></div><p>${esc(g[2])}</p><button type="button" class="tp-more">查看完整小辭典</button>`;
  termPop.style.display='block';
  const r = anchor.getBoundingClientRect(); const w = Math.min(320, innerWidth-20);
  termPop.style.width = w+'px';
  let left = Math.min(Math.max(10, r.left), innerWidth - w - 10); let top = r.bottom + 6;
  termPop.style.left = left+'px'; termPop.style.top = top+'px';
  const h = termPop.offsetHeight; if (top + h > innerHeight - 10) termPop.style.top = Math.max(10, r.top - h - 6)+'px';
  termPop.querySelector('.tp-more').onclick = ()=>{ hideTerm(); openGlossary('', g[0]); };
}
function hideTerm(){ if (termPop) termPop.style.display='none'; }
document.addEventListener('click', e=>{
  const t = e.target.closest && e.target.closest('.term');
  if (t){ e.preventDefault(); e.stopPropagation(); showTerm(t.dataset.term, t); return; }
  if (termPop && !e.target.closest('#termPop')) hideTerm();
}, true);
document.addEventListener('keydown', e=>{ if (e.key==='Escape') hideTerm(); });

function openGlossary(cat='', focus=''){

  const md = modal(`<h2>📖 房地產名詞小辭典</h2><p class="sub">遊戲中出現的專有名詞，點一下就能看解釋。內容為一般性說明，實際規定以主管機關公告為準。</p>
    <input id="gq" type="search" placeholder="搜尋名詞，例如：斡旋、成數、海砂屋" style="width:100%;font-size:16px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)">

    const q = md.querySelector('#gq').value.trim();

    if (cur==='看屋自我檢查' && !q){ box.innerHTML = `<p class="note">以下是看屋時可以自己先檢查的項目，前 10 項是遊戲中「看屋自我檢查」的基本標準，後 11 項通常需要專業驗屋確認。自己看屋只能發現表面問題，重要的房子建議再請專業驗屋。</p>` + INSPECT_ITEMS.map(it=>`<div class="gi"><b>${it.icon} ${it.name}</b><p>${it.self}</p></div>`).join(''); return; }
    const list = GLOSSARY.filter(g=>(cur==='全部'||g[1]===cur||cur==='看屋自我檢查'||cur==='驗屋須知') && (!q || g[0].includes(q) || g[2].includes(q)));
    box.innerHTML = list.length ? list.map(g=>`<div class="gi" id="g-${g[0]}"><b>${g[0]}</b><span class="tag">${g[1]}</span><p>${g[2]}</p></div>`).join('') : '<p class="empty">找不到相關名詞。</p>';
  };
  md.querySelectorAll('#gcat [data-c]').forEach(b=>b.onclick=()=>{ cur=b.dataset.c; md.querySelectorAll('#gcat [data-c]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); draw(); });
  md.querySelector('#gq').oninput = draw;
  if (focus){ md.querySelector('#gq').value = focus; }
  draw();
}

const STD_SELF = ['leak','mold','light','noise','elec','tile','window','gas','roof','area'];

function seededRand(seed){ let h=2166136261; for (const c of seed) h=Math.imul(h^c.charCodeAt(0),16777619); return ()=>{ h+=0x6D2B79F5; let t=h; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; }; }
const hid = (L, key) => seededRand(L.id+':'+key)();   // 物件固定的隱藏屋況，同一間房子每次檢查結果一致
function inspectFee(L){ return Math.round((8000 + L.ping*250)/100)*100; }
const itemDef = id => INSPECT_ITEMS.find(i=>i.id===id);
function selfCheck(L, time, weather){
  const has = x => L.issues.includes(x), rain = weather==='雨', out = [];

  else rain ? add('leak','ok','雨天看屋，沒有發現滲水。') : add('leak','unk','今天沒下雨，看不出雨天會不會滲水，建議下雨天再看一次。');
  has('壁癌') ? add('mold','bad','臥室外牆有白色粉末，油漆鼓起剝落。') : add('mold','ok','牆面乾淨，沒有壁癌。');
  if (time==='night') add('light','unk','晚上看屋，無法判斷白天的採光。');
  else has('採光不佳') ? add('light','bad','白天不開燈室內偏暗，採光不足。') : add('light','ok','白天不開燈也很明亮，通風良好。');
  if (time==='day') add('noise','unk','平日白天鄰居多半不在家，晚上的噪音還不清楚。');
  else has('鄰居嘈雜') ? add('noise','bad', time==='night'?'晚上可以清楚聽到鄰居的聲音。':'假日鄰居在家，聲音蠻明顯的。') : add('noise','ok', time==='night'?'晚上環境安靜。':'假日鄰居在家也不覺得吵。');

  else if (L.age>25) add('elec','unk','配電盤看起來有點年紀，是否有漏電斷路器、線路是否更新過，需要專業確認。');
  else add('elec','ok','配電盤有漏電斷路器，插座外觀正常。');
  (L.cond<60 && hid(L,'tile')<0.6) ? add('tile','bad','輕敲客廳地磚，有幾塊發出空心聲。') : add('tile','ok','輕敲地磚聲音紮實。');
  (L.age>20 && L.cond<65) ? add('window','bad','窗戶關不太緊，矽利康老化發黑。') : add('window','ok','門窗開關順暢。');
  (L.age>20 && hid(L,'gas')<0.3) ? add('gas','bad','熱水器裝在加窗封閉的後陽台，通風不足。') : add('gas','ok','熱水器裝在通風良好的位置。');
  has('頂樓加蓋（違建）') ? add('roof','bad','頂樓有加蓋，不在權狀面積內。') : add('roof','ok','沒有看到加蓋或陽台外推。');
  time==='night' ? add('area','ok','晚上周邊路燈充足，巷弄感覺安全。') : add('area','unk','白天看屋，晚上的周邊環境與治安還不清楚。');
  return out;
}

  else add('chloride','ok','非海砂屋高風險年代，抽測正常。');
  add('radiation','ok', (yr>=1982&&yr<=1986)?'屬於需要留意的興建年代，檢測輻射劑量正常。':'輻射劑量正常。');

  (L.age>20 && hid(L,'gas')<0.3) ? add('gas','bad','熱水器裝在加窗封閉的後陽台，通風不足，有一氧化碳中毒風險。','應改為強制排氣型熱水器或移到通風處。',25000) : add('gas','ok','熱水器位置通風良好。');

  return STD_PRO.map(id=>out.find(x=>x.id===id)).filter(Boolean);

// 依看屋與驗屋結果，整理出「已確認」的屋況問題（議價時才能拿來講）
const ISSUE_OF = {leak:'漏水',mold:'壁癌',light:'採光不佳',noise:'鄰居嘈雜',elec:'管線老舊',roof:'頂樓加蓋（違建）',chloride:'海砂屋（氯離子超標）'};
function knownIssues(L){
  const v = S.seen[L.id]; const set = new Set();
  if (v===true) L.issues.forEach(x=>set.add(x));            // 舊版存檔
  if (v && v.res) for (const r of v.res) if (r.st==='bad' && ISSUE_OF[r.id]) set.add(ISSUE_OF[r.id]);
  if (L.report) for (const r of L.report) if ((r.st==='bad'||(r.st==='warn'&&r.id==='pipe')) && (ISSUE_OF[r.id]||r.id==='pipe')) set.add(r.id==='pipe'?'管線老舊':ISSUE_OF[r.id]);
  return [...set].filter(x=>L.issues.includes(x));
}
const ST_ICON = {ok:'<b class="ck ok">✓</b>',bad:'<b class="ck bad">✗</b>',warn:'<b class="ck warn">⚠</b>',unk:'<b class="ck unk">？</b>',wait:'<b class="ck wait">…</b>'};
const ST_TXT = {ok:'通過',bad:'有問題',warn:'需注意',unk:'待釐清'};
function checklistRows(items, pro){ return items.map((x,i)=>{ const d=itemDef(x.id); return `<div class="ckrow" data-i="${i}"><span class="ckst">${ST_ICON.wait}</span><span class="ckname"><b>${i+1}. ${d.icon} ${d.name}</b><span class="meta ckfind">檢查中……</span></span></div>`; }).join(''); }
function runChecklist(box, items, onDone){
  const rows = box.querySelectorAll('.ckrow'); let i=0; const bar=box.querySelector('.ckbar i'), cnt=box.querySelector('.ckcnt');
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const step = () => {
    if (!box.isConnected) return;
    if (i>=rows.length){ onDone && onDone(); return; }
    const x=items[i], r=rows[i];
    r.querySelector('.ckst').innerHTML = ST_ICON[x.st];
    r.querySelector('.ckfind').innerHTML = esc(x.find) + (x.tip?`<br>建議：${esc(x.tip)}`:'') + (x.cost?`<br>預估費用約 ${W1(x.cost)} 萬`:'');
    r.classList.add('done', 'st-'+x.st);
    i++; if (bar) bar.style.width = (i/rows.length*100)+'%'; if (cnt) cnt.textContent = `${i} / ${rows.length}`;
    if (!reduce) r.scrollIntoView({block:'nearest'});
    setTimeout(step, reduce?0:260);
  };
  box._skip = () => { while (i<rows.length){ const x=items[i], r=rows[i]; r.querySelector('.ckst').innerHTML=ST_ICON[x.st]; r.querySelector('.ckfind').innerHTML=esc(x.find)+(x.tip?`<br>建議：${esc(x.tip)}`:'')+(x.cost?`<br>預估費用約 ${W1(x.cost)} 萬`:''); r.classList.add('done','st-'+x.st); i++; } if (bar) bar.style.width='100%'; if (cnt) cnt.textContent=`${rows.length} / ${rows.length}`; };
  setTimeout(step, 300);
}
function countSt(items){ const c={ok:0,bad:0,warn:0,unk:0}; items.forEach(x=>c[x.st]++); return c; }
function mergeView(prev, cur){ if (!prev) return cur; return cur.map(x=>{ const p=prev.find(y=>y.id===x.id); if (!p) return x; if (x.st==='unk' && p.st!=='unk') return p; return x; }); }

function openInspection(L, opts={}){

依照你的個性評估買方最新這句話的說服力：有根據的理由（實價登錄、真實存在的屋況問題、付款誠意、快速交屋）能讓你稍微鬆動；無理砍價、羞辱、說謊、施壓會讓你不高興。

2. 出價低於底價用 counter，counter_price（單位：萬）必須介於底價與目前開價之間，依個性決定讓步幅度，不要一次讓太多。
3. 這次沒有出價時 decision 用 "talk"（可以反問、試探）。
4. 情緒很差或買方太過分時可以 walkaway 結束談判。
5. reply 用台灣口語繁體中文，1 到 3 句，貼合個性，不要提到遊戲、AI 或底價數字。
6. 不要重複你在對話紀錄裡說過的句子或開頭，語氣要自然有變化；可以回應買方話中的細節、反問、帶點情緒或生活感。

const CN_D = {零:0,〇:0,一:1,二:2,兩:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9};
function cnNum(t){ // 支援「兩千八百」「三千五」「一千二百五十」「八百」等
  if (/^\d+(\.\d+)?$/.test(t)) return parseFloat(t);
  let total=0, cur=0, last=1;
  for (let i=0;i<t.length;i++){ const c=t[i];
    if (c in CN_D){ cur=CN_D[c]; if (i===t.length-1) total += cur*(last>=1000?100:last>=100?10:1); }
    else if (c==='十'){ total += (cur||1)*10; cur=0; last=10; }
    else if (c==='百'){ total += cur*100; cur=0; last=100; }
    else if (c==='千'){ total += cur*1000; cur=0; last=1000; }
    else return NaN; }
  return total;
}
function amountsIn(text){ // 回傳文字中「X萬」的金額（元）

  while ((m=re.exec(text))){ const v=cnNum(m[1]); if (isFinite(v) && v>0) out.push({v:Math.round(v*10000), i:m.index, raw:m[0]}); }
  return out;
}

      else said.push(sayOne(BANK_IDLE[bank.id],B));
    }
  }
  if (Math.random()<0.15 && said.length<2 && BANK_PITCH[bank.id]) said.push(sayOne(BANK_PITCH[bank.id],B));
  B.usedT = B.usedT || {};
  if (Math.random()<0.15 && said.length<3){ const left = Object.keys(BANK_TACTIC).filter(k=>!B.usedT[k]); if (left.length){ const k=pick(left); B.usedT[k]=1; said.push(BANK_TACTIC[k].say[bank.id]); out.sys = `💡 銀行話術識別：${BANK_TACTIC[k].why}`; } }
  B.mem = B.mem || {}; rememberPlayer(B.mem, text);
  if (said.length<3){ const ml = memLineBank(B.mem); if (ml) said.push(ml); else if (Math.random()<0.25){ const bg=officerBgLines(bank,B).filter(x=>!(B.said||{})[x]); if (bg.length) said.push(sayOne(bg,B)); } }
  const parts = said.filter(Boolean); while (parts.length>3) parts.splice(parts.length-2,1);
  out.reply = parts.join('');
  return out;
}

function applyBank(deal,bank,B,C,r){
  const base = Math.min(deal.price, B.appraisal);
  let ltv = isFinite(r.ltv)?r.ltv:B.ltv; ltv = clamp(ltv, B.ltv-5, B.ltv+5);
  let rate = isFinite(r.rate)?r.rate:B.rate; rate = clamp(rate, B.rate-0.15, B.rate+0.15);
  rate = Math.max(rate, bankFloor(bank));
  let years = clamp(r.years||B.years, 20, C.maxY);
  if (bank.id==='gov' && years>30 && C.maxY<40) years=30;
  let grace = C.grace ? clamp(r.grace||0,0,3) : 0;
  B.trust = clamp(B.trust + (r.trust||0), 0, 100);
  ltv = Math.min(ltv, C.cap*100);
  const dbrMax = maxLoanDBR(years, rate, B.guarantor);
  ltv = Math.min(ltv, Math.floor(dbrMax/base*100));
  if (B.trust<25) ltv = Math.min(ltv, B.ltv);
  B.ltv = Math.max(0, Math.round(ltv)); B.rate = +rate.toFixed(3); B.years = years; B.grace = grace;
  if (isFinite(r.fee) && r.fee>=0) B.fee = clamp(r.fee, 0, 20000);
  if (r.conds) B.conds = r.conds.filter(c=>c && c.text).slice(0,4).map(c=>({text:String(c.text).slice(0,40), cost:clamp(parseInt(c.cost)||0,0,Math.round(base*0.015))}));
}

    md.querySelector('#est').innerHTML = s.length ? `總費用 <b>${W1(cost)} 萬</b>　預估屋況 ${p.L.cond} → <b>${L2.cond}</b>　估值增加約 <b>${W(dv)} 萬</b>　工期 <b>${months||'不到 1'}</b> 個月${cost>S.cash?'<br><b style="color:var(--red)">現金不足</b>':''}` : '勾選要施作的項目。';

  };
  md.querySelectorAll('#opts input').forEach(i=>i.onchange=calc); calc();
  md.querySelector('#cancel').onclick=closeModal;
  md.querySelector('#go').onclick=()=>{
    const s=sel(); const cost=s.reduce((a,o)=>a+o.cost,0);
    S.cash-=cost; p.reno+=cost; p.done=[...(p.done||[]),...s.map(o=>o.id)];
    p.L.cond = clamp(p.L.cond+s.reduce((a,o)=>a+o.cond,0),0,100);
    p.L.layout = Math.min(0.05,(p.L.layout||0)+s.reduce((a,o)=>a+(o.layout||0),0));
    p.rentBoost = (p.rentBoost||0)+s.reduce((a,o)=>a+(o.rent||0),0);

    s.forEach(o=>{ if (o.fix) p.L.issues = p.L.issues.filter(x=>x!==o.fix); });
    const months = Math.max(0,...s.map(o=>o.months));
    if (months){ p.prevStatus = p.status==='自住'?'自住':'空置'; p.status='裝修中'; p.renoUntil=S.t+months; }
    addLog(`${titleOf(p.L)} 裝修：${s.map(o=>o.name).join('、')}，花費 ${W1(cost)} 萬。`);
    save(); closeModal(); toast(months?`開工！約 ${months} 個月完工`:'施工完成！');
  };
}

function saleEstimate(p, price, feePct){
  const fee = Math.round(price*feePct/100);
  const landTax = Math.round(price*0.004*Math.min(1,(S.t-p.boughtAt+6)/60));
  const misc = 15000 + Math.round(price*0.0003);
  const held = S.t - p.boughtAt;
  const bal = p.loan?p.loan.balance:0;
  const penalty = p.loan ? Math.round(bal*(held<12?0.01:held<24?0.005:0)) : 0;
  const gain = price - p.cost - p.reno - fee - landTax - misc;
  const selfLong = p.status==='自住' && p.selfSince!=null && S.t-p.selfSince>=72 && S.props.length===1;
  const buyA = absOf(p.boughtAt), sellA = absOf(S.t), A=(y,m)=>y*12+m-1;
  let rate=0, tax=0, taxName='', luxury=0;
  if (buyA < A(2016,1)){
    taxName='舊制財產交易所得（依評定現值，估）'; tax = Math.round(price*0.003); rate=0;
    if (sellA>=A(2011,6) && sellA<A(2016,1) && held<24 && p.status!=='自住'){ luxury = Math.round(price*(held<12?0.15:0.10)); }
  } else {
    const v2 = sellA >= A(2021,7);
    rate = v2 ? (held<=24?0.45:held<=60?0.35:held<=120?0.2:0.15) : (held<=12?0.45:held<=24?0.35:held<=120?0.2:0.15);
    taxName = v2 ? '房地合一稅2.0' : '房地合一稅1.0';
    let taxable = Math.max(0,gain);
    if (selfLong){ taxable = Math.max(0,gain-4000000); rate = 0.1; }
    tax = Math.round(taxable*rate);
  }
  tax += luxury;
  return {fee, landTax, misc, penalty, gain, tax, rate, bal, net: price - fee - landTax - misc - penalty - tax - bal, held, selfLong, taxName, luxury};
}

  };
  md.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{ mode=b.dataset.mode; md.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); if (SALE_MODES[mode].fee[1]) md.querySelector('#fee').value = SALE_MODES[mode].fee[1]; calc(); });
  md.querySelectorAll('#ask,#fee,#mon').forEach(i=>i.oninput=calc); calc();

  md.querySelector('#go').onclick=()=>{

    p.sale = {mode, feePct:fee, ask, until:S.t+mon, agency, label: SALE_MODES[mode].label+(agency?`（${agency}）`:'')};

function offerProb(p, ask, mode, fee){
  const M = SALE_MODES[mode]; const v = valueOf(p.L);
  const feeF = mode==='self'?1:Math.sqrt(fee/4);
  const priceF = Math.exp(-Math.max(0, ask/v-0.98)*9);
  const heat = 0.85 + (S.idx[p.L.ck]-1)*3;
  return clamp(M.exp*0.6*feeF*priceF*(p.L.staging?1.15:1)*(p.status==='出租'?0.8:1)*heat, 0.02, 0.8);
}

      if (ctr <= B.offer){ B.offer = ctr; out.push(say1(BUYER_SAY.accept)); bubble('them', out.join(' ')); upd(); end(); setTimeout(()=>completeSale(p, ctr), 600); return; }
      if (ctr <= mx && B.mood>=35 && Math.random()<0.75){ B.offer = ctr; out.push(say1(BUYER_SAY.accept)); bubble('them', out.join(' ')); upd(); end(); setTimeout(()=>completeSale(p, ctr), 600); return; }
      if (ctr > mx*1.06){ B.mood-=10; out.push(say1(BUYER_SAY.high)); }
      const target = Math.min(ctr, mx);
      const nOffer = Math.round((B.offer + (target-B.offer)*T.conc*(B.mood>50?1:0.6))/10000)*10000;
      if (nOffer > B.offer){ const d=nOffer-B.offer; B.offer=nOffer; out.push(say1(BUYER_SAY.raise).replace('{d}',W(d)).replace('{o}',W(nOffer))); }
      else out.push(say1(BUYER_SAY.hold).replace('{o}',W(B.offer)));
      decided = true;
    } else if (B.persuade>2 && B.offer < mx && Math.random()<0.4){
      const nOffer = Math.round((B.offer + (mx-B.offer)*0.25)/10000)*10000;
      if (nOffer>B.offer){ const d=nOffer-B.offer; B.offer=nOffer; out.push(say1(BUYER_SAY.raise).replace('{d}',W(d)).replace('{o}',W(nOffer))); decided=true; }
    }
    if (B.round>7){ B.mood-=4; if (!decided) out.push(say1(BUYER_SAY.tired)); }
    B.mem = B.mem || {}; rememberPlayer(B.mem, text);
    if (out.length<3){ const ml = memLineBuyer(B, B.mem); if (ml) out.push(ml); else if (B.mood>35 && Math.random()<0.3){ const bg=buyerBgLines(B,p).filter(x=>!B.said[x]); if (bg.length) out.push(say1(bg)); } }
    B.mood = clamp(B.mood,-10,100);
    while (out.length>3) out.splice(1,1);
    bubble('them', out.join(' ') || say1(BUYER_SAY.hold).replace('{o}',W(B.offer)));
    if (B.mood<=0){ end(); bubble('them', say1(BUYER_SAY.leave)); addLog(`${B.name}議價破局，離開了。`); upd(); return; }
    // 買方追問或出招
    if (!B.pendingQ && Math.random()<0.35){ const left=BUYER_Q.filter(q=>!B.asked[q.id]); if (left.length){ const q=pick(left); B.asked[q.id]=1; B.pendingQ=q.id; bubble('them', q.q); } }
    else if (Math.random()<0.3){ const bp=pick(BUYER_PRESS); bubble('them', bp.say); bubble('sys', `💡 買方話術識別：${bp.why}`); }
    if (agent && Math.random()<0.25) bubble('them', pick(AGENT_SELL));
    upd();
  };
  md.querySelector('#send').onclick = send;
  md.querySelector('#say').addEventListener('keydown', e=>{ if (e.key==='Enter' && (e.ctrlKey||e.metaKey)) send(); });
}

function completeSale(p, price){
  if (SALE_DEB && SALE_DEB.p===p && SALE_DEB.maxFn) SALE_DEB.max = SALE_DEB.maxFn();
  const debHTML = saleDebrief(p, price); SALE_DEB = null;
  const e = saleEstimate(p, price, p.sale?p.sale.feePct:0);
  S.cash += e.net;
  S.props = S.props.filter(x=>x!==p);
  const profit = price - p.cost - p.reno - e.fee - e.landTax - e.misc - e.penalty - e.tax;
  addLog(`🎉 售出 ${titleOf(p.L)}，成交 ${W(price)} 萬，繳稅 ${W1(e.tax)} 萬，實拿 ${W(e.net)} 萬，淨利 ${profit>=0?'+':''}${W(profit)} 萬。`, profit>=0?'good':'');
  save();
  modal(`<h2>成交！</h2><p class="sub">${esc(titleOf(p.L))}</p><table class="t"><tr><td>成交價</td><td>${W(price)} 萬</td></tr><tr><td>仲介費＋稅費＋違約金</td><td>−${W1(e.fee+e.landTax+e.misc+e.penalty)} 萬</td></tr><tr><td>房地合一稅</td><td>−${W1(e.tax)} 萬</td></tr><tr><td>清償房貸</td><td>−${W(e.bal)} 萬</td></tr><tr class="total"><td>入帳現金</td><td>${W(e.net)} 萬</td></tr></table><p class="note">這筆投資的淨利（扣除買入成本、裝修、所有稅費）：<b class="${profit>=0?'up':'down'}">${profit>=0?'+':''}${W(profit)} 萬</b></p>${debHTML}<div class="foot"><button class="btn red" id="ok">好</button></div>`).querySelector('#ok').onclick=closeModal;
}

<h3>七、議價與貸款情境</h3><p>遊戲中的議價話術是為了讓使用者認識常見的談判方式與其背後的心理，並非鼓勵在真實交易中使用不實陳述。現實中向銀行或交易對象提供不實資料，可能涉及民事或刑事責任。</p>
<h3>八、個人資料與存檔</h3><p>本軟體不設會員、不收集姓名或聯絡方式。遊戲進度只儲存在使用者自己裝置的瀏覽器中，開發者無法讀取；清除瀏覽器資料後存檔即會消失。本版本不使用 AI 服務，對話內容不會傳送到任何伺服器。地圖的道路資料會從上述 Overpass 伺服器查詢，這些第三方服務會依其各自的隱私政策處理連線資訊（例如 IP 位址）。</p>
<h3>九、第三方資源與授權</h3><p>本軟體使用 Google Fonts 提供的 Noto Sans TC、Barlow Condensed 字型（SIL Open Font License），地圖使用 Leaflet（BSD-2 授權）繪製；行政區界線資料來源為內政部國土測繪中心「鄉鎮市區界線（TWD97經緯度）」，依政府資料開放授權條款－第1版（https://data.gov.tw/license）提供，經 taiwan-atlas 專案（MIT 授權）轉換並由本軟體簡化；道路線形資料 © OpenStreetMap 貢獻者（ODbL），透過 OpenStreetMap Overpass API 查詢（主伺服器為 overpass-api.de；忙碌時改用奧地利非營利組織 Private.coffee 提供、允許任何專案使用的公開伺服器 overpass.private.coffee），查詢內容僅為路名與範圍，不含任何個人資料。地圖只繪製行政區界與道路，不顯示任何建物、門牌或標記點。其餘圖形與程式為本軟體自行製作。本軟體中的外部連結僅為方便使用者查詢，連結網站的內容、服務與隱私政策由該網站自行負責，與本軟體無關。</p>
<h3>十、關於贊助</h3><p>本軟體免費提供，玩家可自由選擇是否贊助。贊助屬自願性質，不會解鎖任何額外功能或內容，也不代表購買任何服務或建議。</p>
<h3>十一、責任限制</h3><p>本軟體按現狀提供，不保證內容正確、完整或不中斷。使用者因使用或信賴本軟體內容所生之任何直接或間接損失，開發者在法律允許的範圍內不負賠償責任。使用本軟體即表示您已閱讀並同意本聲明。</p>

// ======================= 情境挑戰 =======================
const CHALLENGES = [
  {id:'first800', icon:'🏙️', title:'用 800 萬自備款在雙北買到第一間房', desc:'2026 年 10 月，你是 35 歲科技業工程師，手上只有 800 萬。24 個月內在台北市或新北市買下第一間房。', cash:8000000, y:2026, m:10, prof:'eng', city:'nt', months:24, tip:'雙北總價高，要算好負債比和自備款，議價每少 1% 都很重要。'},
  {id:'cut92', icon:'🤝', title:'把屋主從開價談到 92 折', desc:'你是 38 歲國小老師，手上 1,500 萬。12 個月內，用不超過開價 92% 的價格買下任何一間房。', cash:15000000, y:2026, m:10, prof:'teacher', city:'tc', months:12, tip:'先看屋找出個性好談的屋主，善用屋況問題與實價登錄。'},
  {id:'free70', icon:'🎨', title:'接案設計師也能貸到七成', desc:'你是 29 歲接案平面設計師，收入不固定，手上 600 萬。18 個月內買房，而且房貸成數（貸款÷成交價）至少七成。', cash:6000000, y:2026, m:10, prof:'freelance', city:'ks', months:18, tip:'銀行很難認列接案收入，挑總價合適的物件，善用財力證明與共同借款人。'}
];
const CHAL_KEY = 'intern-chal-best';
document.addEventListener('click', e=>{ if (e.target.closest && e.target.closest('[data-chalinfo]')) chalInfo(); });
function chalBest(){ try{ return JSON.parse(localStorage.getItem(CHAL_KEY)||'{}'); }catch(e){ return {}; } }
function chalDef(){ return S && S.challenge ? CHALLENGES.find(c=>c.id===S.challenge.id) : null; }
function chalBar(){
  const c = chalDef(); if (!c || S.challenge.done) return '';
  const left = S.challenge.deadline - S.t;
  return `<div class="chalbar">🎯 <span><b>情境挑戰：${esc(c.title)}</b>　剩 <b>${left}</b> 個月</span><button class="btn sm ghost" data-chalinfo="1">挑戰說明</button></div>`;
}
function chalCheck(ev, p, loan){
  const c = chalDef(); if (!c || S.challenge.done) return;
  const used = S.t, left = Math.max(0, S.challenge.deadline - S.t), tBonus = left/c.months*15;
  if (ev==='timeout') return chalResult(false, 0, '時間到了，這次沒有達成目標。');
  if (ev!=='buy' || !p) return;
  const ratio = p.price/(p.ask||p.price), ltv = p.loan ? p.loan.principal/p.price : 0;
  const clauseBonus = Math.min(6, (p.clauses||[]).length);
  if (c.id==='first800'){
    if (!['tp','nt'].includes(p.L.ck)){ toast('這間不在雙北，挑戰目標是台北市或新北市喔'); return; }
    const sc = 55 + tBonus + clamp((1-ratio)*250,0,20) + clauseBonus + (S.cash>0?Math.min(5,S.cash/1000000):0);
    return chalResult(true, sc, `你在第 ${used} 個月買下 ${titleOf(p.L)}，成交價 ${W(p.price)} 萬（開價的 ${(ratio*100).toFixed(1)}%）。`);
  }
  if (c.id==='cut92'){
    if (ratio>0.92){ toast(`這間是開價的 ${(ratio*100).toFixed(1)}%，還沒達到 92 折，繼續努力`); return; }
    const sc = 60 + clamp((0.92-ratio)*500,0,20) + tBonus*0.7 + clauseBonus;
    return chalResult(true, sc, `你把 ${titleOf(p.L)} 從開價 ${W(p.ask)} 萬談到 ${W(p.price)} 萬，是開價的 ${(ratio*100).toFixed(1)}%。`);
  }
  if (c.id==='free70'){
    if (ltv<0.695){ toast(`這筆房貸成數 ${(ltv*100).toFixed(0)}%，未達七成`); return; }
    const sc = 60 + clamp((ltv-0.7)*150,0,12) + (loan?clamp((2.6-loan.rate)*30,0,10):0) + tBonus*0.6 + clauseBonus;
    return chalResult(true, sc, `你以接案設計師身份，向${p.loan.bank}貸到 ${(ltv*100).toFixed(0)}% 成數${loan?`、利率 ${loan.rate.toFixed(2)}%`:''}，買下 ${titleOf(p.L)}。`);
  }
}
function chalResult(win, sc, msg){
  const c = chalDef(); sc = Math.round(clamp(sc,0,100)); const g = win?gradeOf(sc):'—';
  S.challenge.done = true; S.challenge.win = win; S.challenge.score = sc; save();
  const best = chalBest(); const prev = best[c.id]||0; if (win && sc>prev){ best[c.id]=sc; try{ localStorage.setItem(CHAL_KEY, JSON.stringify(best)); }catch(e){} }
  const share = win ? `我在《地產實習生》完成挑戰「${c.title}」，拿到 ${g} 級（${sc} 分）！${msg}\n你也來試試：https://kidspark.itch.io/thepropertyintern\n#地產實習生 #房地產 #議價` : `我在《地產實習生》挑戰「${c.title}」失敗了……誰來幫我破關？\nhttps://kidspark.itch.io/thepropertyintern\n#地產實習生 #房地產 #議價`;
  const md = modal(`<h2>${win?'🎉 挑戰成功':'⌛ 挑戰失敗'}</h2><p class="sub">${c.icon} ${esc(c.title)}</p>
    ${win?`<p><span class="grade" style="display:inline-block;color:#fff;font-weight:800;font-size:28px;border-radius:10px;padding:4px 14px;background:${GRADE_COLOR[g]}">${g}</span> <b style="font-size:24px">${sc} 分</b>${sc>prev&&prev?`　🏆 新紀錄（之前 ${prev} 分）`:prev?`　最佳紀錄 ${Math.max(prev,sc)} 分`:''}</p>`:''}
    <p>${esc(msg)}</p>
    <p class="meta">分數依完成速度、議價成果、房貸條件與合約完整度計算。</p>
    <p style="margin:10px 0 4px"><b>分享成績</b></p><textarea class="sharebox" id="shareTxt" readonly>${esc(share)}</textarea>
    <div class="foot"><button class="btn ghost" id="copyShare">複製分享文字</button><button class="btn ghost" id="retry">再挑戰一次</button><button class="btn red" id="goOn">繼續自由遊玩</button></div>`);
  md.querySelector('#copyShare').onclick=()=>{ const t=md.querySelector('#shareTxt'); t.select(); try{ navigator.clipboard.writeText(t.value).then(()=>toast('已複製'),()=>{ document.execCommand('copy'); toast('已複製'); }); }catch(e){ document.execCommand('copy'); toast('已複製'); } };
  md.querySelector('#retry').onclick=()=>{ startChallenge(c.id); };
  md.querySelector('#goOn').onclick=closeModal;
}
function startChallenge(id){
  const c = CHALLENGES.find(x=>x.id===id);
  newGame(c.cash, c.y, c.m, c.prof);
  S.challenge = {id, deadline:c.months, done:false}; S.city = c.city; S.dist = 0; S.intro = true;
  addLog(`🎯 情境挑戰開始：${c.title}。期限 ${c.months} 個月。`,'good');
  save(); closeModal(); render();
  chalInfo();
}
function chalInfo(){
  const c = chalDef(); if (!c) return;
  modal(`<h2>${c.icon} 情境挑戰</h2><p class="sub">${esc(c.title)}</p><p>${esc(c.desc)}</p><p class="note">💡 ${esc(c.tip)}<br>剩餘時間：${Math.max(0,S.challenge.deadline-S.t)} 個月。按「下個月」推進時間，時間到還沒達成就算失敗。</p><div class="foot"><button class="btn red" id="ok">開始</button></div>`).querySelector('#ok').onclick=closeModal;
}

function showDisclaimer(){ modal(DISC_HTML + `<div class="foot"><button class="btn red" id="discOk">我知道了</button></div>`).querySelector('#discOk').onclick=closeModal; }
function setup(first){
  const presets = [1000,1500,2000,2500,3000,5000];
  const md = modal(`<h2>${first?'歡迎來到《地產實習生》':'重新開始'}</h2><p class="sub">台北・新北・桃園・新竹・台中・臺南・高雄</p>
    <div class="modes" id="modePick"><button class="mode" data-mode="free" aria-pressed="true"><b>🗺️ 自由模式</b><small>自選資金與年代，自由買賣經營</small></button><button class="mode" data-mode="chal" aria-pressed="false"><b>🎯 情境挑戰</b><small>固定條件與期限，挑戰高分並分享成績</small></button></div>
    <div id="chalOpts" style="display:none"><div class="modes" id="chalPick">${CHALLENGES.map((c,i)=>{ const b=chalBest()[c.id]; return `<button class="mode" data-chal="${c.id}" aria-pressed="${i===0}"><b>${c.icon} ${esc(c.title)}</b><small>${esc(c.desc)}${b?`<br>🏆 最佳 ${b} 分`:''}</small></button>`; }).join('')}</div></div>
    <div id="freeOpts">
    <div class="note" id="profCard"></div>
    <p>先決定你的起始資金：</p>
    <div class="modes" id="cashPick">${presets.map(v=>`<button class="mode" data-v="${v}" aria-pressed="${v===1000}"><b class="n" style="font-size:22px">${v.toLocaleString()} 萬</b><small>${v<=1000?'標準難度：台北要精打細算':v<=2000?'寬裕：三都都有不少選擇':v<=3000?'富足：可以同時經營多間':'大戶：直攻蛋黃區'}</small></button>`).join('')}<button class="mode" data-v="custom" aria-pressed="false"><b>自訂金額</b><small>300 萬～5 億，自己決定</small></button></div>
    <div class="field" id="customWrap" style="display:none">起始資金（萬）<input type="number" id="customCash" min="300" max="50000" step="100" value="1200"></div>
    <p style="margin:14px 0 6px">選擇開始的時間點（房價、利率、信用管制與稅制都會依當時的狀況變化）：</p>
    <p class="note" style="margin:0 0 8px">本軟體製作於 2026 年 9 月。之前的房價為參考實價登錄與房價指數整理的近似值；遊戲時間超過 2026 年 10 月後，房價、利率與新聞改為<b>軟體隨機模擬推估</b>，不代表未來一定會漲或跌，請勿作為投資判斷。</p>
    <div class="row"><select id="sy">${Array.from({length:19},(_,i)=>2008+i).map(y=>`<option ${y===2026?'selected':''}>${y}</option>`).join('')}</select> 年
      <select id="sm">${Array.from({length:12},(_,i)=>i+1).map(m=>`<option ${m===10?'selected':''}>${m}</option>`).join('')}</select> 月</div>
    <div class="modes" style="margin-top:8px" id="eraPick">${[[2008,9,'金融海嘯','房價低點'],[2012,8,'實價登錄上路','多頭中段'],[2016,1,'房地合一','盤整期'],[2020,3,'疫情資金潮','大多頭起點'],[2026,10,'現在','信用管制下']].map(([y,m,a,b])=>`<button class="mode" data-y="${y}" data-m="${m}"><b>${y}/${m} ${a}</b><small>${b}</small></button>`).join('')}</div>
    </div>
    <p class="note"><b>玩法</b><br>1. 在「看房市場」切換台北、台中、高雄與各行政區，查看實價行情與地圖。<br>2. 先看屋了解屋況與屋主個性，再用各種話術議價；小心惹毛屋主，也要識破屋主與仲介的話術。<br>3. 找銀行談房貸：成數、利率、寬限期都能談，但要遵守央行規定與負債比。<br>4. 買到房子後可以自住、出租、裝修改造，再選擇自售或委託仲介賣出。<br>5. 按「下個月」推進時間，房價、利率與新聞都會變動。<br>遇到不懂的名詞，點一下有虛線的字就能看解釋，或打開右上角的「📖 小辭典」。</p>
    <p class="meta">${inClaude?'在 Claude 中開啟時，議價與銀行面談可使用 AI 對談，自由輸入任何話術（首次使用會詢問授權）。':'目前為經典對談模式：系統會從你輸入的文字判斷話術。'}遊戲進度會自動存在這個瀏覽器。${first?'':'<b>重新開始會清除目前進度。</b>'}</p>
    <label class="meta" style="display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:13px"><input type="checkbox" id="agree" style="margin-top:3px"> <span>我了解本軟體僅供學習模擬，房價為近似值、未來為隨機推估，不構成任何投資或財務建議，並同意 <a href="#" id="discLink">完整免責聲明</a>。</span></label>
    <div id="discInline" class="note" style="display:none;margin-top:10px;max-height:320px;overflow-y:auto"></div>
    <div class="foot">${first?'':'<button class="btn ghost" id="cancelSetup">取消</button>'}<button class="btn red" id="startGame" disabled>開始遊戲</button></div>`);
  md.dataset.lock = '1'; if (first) md.querySelector('.x').style.display = 'none';
  let profId = pick(PROFILES).id;
  const drawProf = () => { const P=PROFILES.find(x=>x.id===profId); md.querySelector('#profCard').innerHTML = `<b style="font-size:16px">🎲 你的角色：${P.age} 歲・${P.job}</b><br>家庭狀況：${P.house}<br>家庭月收入約 <b>${W1(P.income)} 萬</b>、生活費約 ${W1(P.living)} 萬、目前租屋每月 ${W1(P.rent)} 萬（越早的年代收入越低）<br>銀行眼中的你：<b>${TIER[P.tier].label}</b>。${P.note}<div style="margin-top:6px"><button class="btn sm ghost" type="button" id="reroll">換一個角色</button></div>`; md.querySelector('#reroll').onclick = () => { let n; do { n=pick(PROFILES).id; } while (n===profId); profId=n; drawProf(); }; };
  drawProf();
  let choice = '1000';
  md.querySelectorAll('#cashPick [data-v]').forEach(b=>b.onclick=()=>{ md.querySelectorAll('#cashPick [data-v]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); choice=b.dataset.v; md.querySelector('#customWrap').style.display = choice==='custom'?'':'none'; if (choice==='custom') md.querySelector('#customCash').focus(); });
  md.querySelectorAll('#eraPick [data-y]').forEach(b=>b.onclick=()=>{ md.querySelector('#sy').value=b.dataset.y; md.querySelector('#sm').value=b.dataset.m; md.querySelectorAll('#eraPick [data-y]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); });
  let mode='free', chalId=CHALLENGES[0].id;
  md.querySelectorAll('#modePick [data-mode]').forEach(b=>b.onclick=()=>{ mode=b.dataset.mode; md.querySelectorAll('#modePick [data-mode]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); md.querySelector('#freeOpts').style.display = mode==='free'?'':'none'; md.querySelector('#chalOpts').style.display = mode==='chal'?'':'none'; md.querySelector('#startGame').textContent = mode==='chal'?'開始挑戰':'開始遊戲'; });
  md.querySelectorAll('#chalPick [data-chal]').forEach(b=>b.onclick=()=>{ chalId=b.dataset.chal; md.querySelectorAll('#chalPick [data-chal]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); });
  md.querySelector('#agree').onchange = e => { md.querySelector('#startGame').disabled = !e.target.checked; };
  md.querySelector('#discLink').onclick = e => { e.preventDefault(); const d=md.querySelector('#discInline'); d.style.display = d.style.display==='none' ? '' : 'none'; if (!d.innerHTML) d.innerHTML = DISC_HTML; };
  const cs = md.querySelector('#cancelSetup'); cs && (cs.onclick = ()=>{ delete md.dataset.lock; closeModal(); });
  md.querySelector('.x').onclick = ()=>{ if (!first){ delete md.dataset.lock; closeModal(); } };
  md.querySelector('#startGame').onclick = ()=>{
    if (mode==='chal'){ delete md.dataset.lock; startChallenge(chalId); return; }
    const v = choice==='custom' ? parseFloat(md.querySelector('#customCash').value) : +choice;
    if (!(v>=300 && v<=50000)){ toast('請輸入 300 萬到 50,000 萬（5 億）之間的金額'); return; }
    let sy=+md.querySelector('#sy').value, sm=+md.querySelector('#sm').value; if (sy===2026 && sm>10) sm=10;
    newGame(Math.round(v)*10000, sy, sm, profId); S.intro = true; save(); delete md.dataset.lock; closeModal();
    toast(`起始資金 ${Math.round(v).toLocaleString()} 萬，開始看房吧！`);
  };
}
$('#restart').onclick = () => setup(false);
$('#discBtn').onclick = showDisclaimer;
$('#glossBtn').onclick = () => openGlossary();
if (!load()) newGame();
render();
if (!S.intro) setup(true);
})();
</script>
