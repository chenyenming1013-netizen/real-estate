<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>房產新手村：買房小白實戰訓練</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbf7ef; --card:#ffffff; --ink:#1f2a44; --muted:#6f6a60; --line:#e6ddcc;
  --red:#d7263d; --yellow:#ffd23f; --green:#17805a; --blue:#2f5bd3; --soft:#f3ecdf;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --paper:#15171c; --card:#1e2128; --ink:#eef0f5; --muted:#a3a19a; --line:#2f333c; --soft:#262a32; --green:#3fbf8c; --blue:#7a9cff; } }
:root[data-theme="dark"]{ --paper:#15171c; --card:#1e2128; --ink:#eef0f5; --muted:#a3a19a; --line:#2f333c; --soft:#262a32; --green:#3fbf8c; --blue:#7a9cff; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.55}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.n{font-family:"Barlow Condensed","Noto Sans TC",sans-serif;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}
a{color:var(--blue)}

header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) header{background:#0c0e12} }
.brand{display:flex;align-items:center;gap:10px}
.sale{width:44px;height:44px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:900;font-size:26px;border-radius:4px;transform:rotate(-4deg);box-shadow:3px 3px 0 var(--yellow)}
.brand b{font-size:20px;font-weight:900;display:block;line-height:1.1}
.brand small{font-size:12px;color:#c9cbd3}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-left:auto;align-items:center}
.stat{display:flex;flex-direction:column;line-height:1.1}
.stat span{font-size:11px;color:#b8bcc8}
.stat b{font-size:22px}
.stat b.pos{color:#7fe0b0} .stat b.neg{color:#ff8a95}
#nextBtn{background:var(--yellow);color:#1f2a44;border:0;font-weight:900;padding:10px 16px;border-radius:6px;font-size:15px;box-shadow:0 3px 0 #b8910b}
#nextBtn:active{transform:translateY(2px);box-shadow:0 1px 0 #b8910b}

nav{display:flex;gap:4px;padding:10px 16px 0;max-width:1280px;margin:0 auto;border-bottom:2px solid var(--line);flex-wrap:wrap;align-items:flex-end}
nav button{background:none;border:0;padding:8px 14px 10px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}
nav .ai{margin-left:auto;font-size:12px;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--muted);margin-bottom:8px}
nav .ai.on{background:#e6f5ee;color:#17805a}
main{max-width:1280px;margin:0 auto;padding:16px}

.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.seg button{border:2px solid var(--ink);background:var(--card);padding:6px 16px;border-radius:999px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--card);padding:6px 10px;border-radius:8px;text-align:left;line-height:1.2}
.chip b{display:block;font-size:14px}
.chip span{font-size:12px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.up{color:var(--red)} .down{color:var(--green)}

.mk{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.panel h3{margin:0 0 8px;font-size:17px;font-weight:900}
.mapbox{border-radius:10px;overflow:hidden;background:var(--soft);border:1px solid var(--line)}
.mapbox iframe{display:block;width:100%;height:260px;border:0}
.mapfb{padding:22px 16px;text-align:center}
.mapfb .pin{font-size:34px}
.mapfb p{margin:6px 0 12px;color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin-top:10px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-weight:700;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.yel{background:var(--yellow);border-color:var(--yellow);color:#1f2a44}
.btn.sm{padding:5px 10px;font-size:13px;border-width:1.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}

.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.lc{display:grid;grid-template-columns:96px 1fr;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;position:relative}
.lc:hover{border-color:var(--ink)}
.lc svg{width:96px;height:96px;border-radius:8px;display:block}
.lc h4{margin:0;font-size:14px;font-weight:700;line-height:1.35}
.price{font-size:30px;line-height:1;margin:4px 0 2px}
.price small{font-size:14px;font-family:"Noto Sans TC",sans-serif;font-weight:700;margin-left:2px}
.meta{font-size:12px;color:var(--muted)}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.tag{font-size:11px;padding:1px 7px;border-radius:4px;background:var(--soft);color:var(--muted);font-weight:700}
.tag.red{background:var(--red);color:#fff} .tag.yel{background:var(--yellow);color:#1f2a44} .tag.grn{background:var(--green);color:#fff}
.stamp{position:absolute;top:8px;right:10px;border:2px solid var(--red);color:var(--red);font-weight:900;font-size:12px;padding:0 5px;border-radius:3px;transform:rotate(6deg)}

.props{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.pc .top{display:flex;gap:12px}
.pc svg{width:72px;height:72px;border-radius:8px;flex:none}
.pc .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0;font-size:12px;color:var(--muted)}
.pc .grid b{display:block;font-size:19px;color:var(--ink)}
.pc .acts{display:flex;gap:6px;flex-wrap:wrap}
.summary{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.summary div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--muted)}
.summary b{display:block;font-size:24px;color:var(--ink)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.feed{display:flex;flex-direction:column;gap:8px}
.feed .it{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ink);border-radius:8px;padding:8px 12px;font-size:14px}
.feed .it.news{border-left-color:var(--red)}
.feed .it.good{border-left-color:var(--green)}
.feed time{font-size:12px;color:var(--muted);margin-right:8px}

/* modal */
#mw{position:fixed;inset:0;background:rgba(15,18,25,.6);display:none;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 12px 16px;z-index:20;overflow-y:auto}
#mw.open{display:flex}
#md{background:var(--card);color:var(--ink);width:min(760px,100%);border-radius:14px;padding:20px;margin:auto 0;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#md.wide{width:min(1060px,100%)}
#md h2{margin:0 0 4px;font-size:22px;font-weight:900;padding-right:36px}
#md .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:0;background:var(--soft);font-size:18px}
.foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.note{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--muted);line-height:1.6}
.note b{color:var(--ink)}
.warn{background:#fff1f2;color:#9f1239;border-radius:8px;padding:10px 12px;font-size:13px}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .warn{background:#3a1c22;color:#ffb3bd} }
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td{padding:5px 0;border-bottom:1px dashed var(--line)}
table.t td:last-child{text-align:right;font-weight:700}
table.t tr.total td{border-top:2px solid var(--ink);border-bottom:0;font-size:16px;padding-top:8px}

/* steps */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin:0 0 14px;counter-reset:st;padding-right:36px}
.step{position:relative;text-align:center;font-size:12px;color:var(--muted);padding-top:2px}
.step::before{content:'';position:absolute;top:15px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0}
.step:first-child::before{display:none}
.step i{position:relative;z-index:1;display:grid;place-items:center;width:30px;height:30px;margin:0 auto 4px;border-radius:50%;background:var(--soft);border:2px solid var(--line);font-style:normal;font-weight:900;font-family:"Barlow Condensed",sans-serif;font-size:16px;color:var(--muted)}
.step b{display:block;font-size:13px;color:var(--muted)}
.step.done i{background:var(--green);border-color:var(--green);color:#fff}
.step.done::before,.step.cur::before{background:var(--green)}
.step.done b{color:var(--green)}
.step.cur i{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 0 4px rgba(215,38,61,.18)}
.step.cur b{color:var(--ink)}
.steptip{background:var(--soft);border-left:4px solid var(--red);border-radius:6px;padding:8px 12px;font-size:13px;margin:-4px 0 14px;line-height:1.6}
.steptip b{color:var(--red)}
.flow{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px 4px;margin-bottom:14px}
.flow h3{margin:0 0 10px;font-size:15px}
.flow .steps{padding-right:0}
.pending{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff8d6;border:1px solid #f0d36b;border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:14px;color:#5a4a00}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .pending{background:#3a3418;border-color:#6b5a1c;color:#f3e3a0} }
@media (max-width:640px){ .step b{font-size:11px} .step small{display:none} .step i{width:26px;height:26px;font-size:14px} .step::before{top:13px} }
/* chat */
.nego{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px}
.side{display:flex;flex-direction:column;gap:10px}
.avatar{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:22px;color:#fff;background:var(--ink);flex:none}
.who{display:flex;gap:10px;align-items:center}
.who b{font-size:17px}
.meter{height:10px;border-radius:5px;background:var(--soft);overflow:hidden}
.meter i{display:block;height:100%;transition:width .4s,background .4s}
.bigprice{font-size:34px;line-height:1}
.chat{height:340px;overflow-y:auto;background:var(--soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:85%;padding:8px 12px;border-radius:12px;font-size:14px;line-height:1.55;white-space:pre-wrap}
.msg.them{background:var(--card);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:3px}
.msg.me{background:var(--ink);color:var(--paper);align-self:flex-end;border-bottom-right-radius:3px}
.msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:12px;padding:2px}
.msg .off{display:inline-block;margin-top:4px;background:var(--yellow);color:#1f2a44;border-radius:4px;padding:0 6px;font-weight:700;font-size:12px}
.tact{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tact button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px;font-size:13px}
.tact button:hover{border-color:var(--ink)}
.tact button.used{opacity:.45}
.inrow{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.inrow textarea{flex:1 1 260px;min-height:62px;resize:vertical;border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:14px;background:var(--card);color:var(--ink)}
.offer{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.offer input{width:130px;font-size:20px;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.terms{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.terms div{background:var(--soft);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--muted)}
.terms b{display:block;font-size:20px;color:var(--ink)}
.banks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.bank{border:2px solid var(--line);border-radius:12px;padding:12px;text-align:left;background:var(--card)}
.bank:hover{border-color:var(--ink)}
.bank b{font-size:17px;display:block}
.bank .k{font-size:12px;color:var(--red);font-weight:700}
.bank p{font-size:13px;color:var(--muted);margin:6px 0 0}
.opt{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer}
.opt:hover{border-color:var(--ink)}
.opt small{display:block;color:var(--muted);font-size:12px}
.opt .n{font-size:18px}
.opt.dis{opacity:.45;cursor:not-allowed}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.mode{border:2px solid var(--line);border-radius:10px;padding:10px;text-align:left;background:var(--card)}
.mode[aria-pressed="true"]{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.mode b{display:block}
.mode small{color:var(--muted);font-size:12px;display:block;line-height:1.45;margin-top:3px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);margin:10px 0}
.field input[type=range]{accent-color:var(--red)}
.field input[type=number]{font-size:18px;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;width:160px;background:var(--card);color:var(--ink)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:10px;font-weight:700;opacity:0;transition:all .3s;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.spark{width:100%;height:90px}
@media (max-width:860px){
  .mk,.two,.nego{grid-template-columns:1fr}
  .stats{gap:12px;margin-left:0;width:100%}
  .stat b{font-size:18px}
  .chat{height:300px}
}

	}

// 自繪行政區房價地圖（不需任何外部服務）＋ OpenStreetMap 免費地圖（僅在自己的網站上內嵌）
function priceMapSVG(ck, sel, clickable){
  const pts = CITIES[ck].dists.map((d,i)=>({i, name:d[0], ll:GEO[ck][d[0]], u:unitNow(ck,i)}));
  const lats = pts.map(p=>p.ll[0]), lngs = pts.map(p=>p.ll[1]);
  const la0=Math.min(...lats), la1=Math.max(...lats), lo0=Math.min(...lngs), lo1=Math.max(...lngs);
  const W=360, H=250, pad=46;
  const sx = (W-pad*2)/Math.max(1e-6,lo1-lo0), sy = (H-pad*2)/Math.max(1e-6,la1-la0), sc=Math.min(sx,sy);
  const ox = (W-(lo1-lo0)*sc)/2, oy = (H-(la1-la0)*sc)/2;
  const X = lo => ox+(lo-lo0)*sc, Y = la => oy+(la1-la)*sc;
  const us = pts.map(p=>p.u), umin=Math.min(...us), umax=Math.max(...us);
  const col = u => { const t=(u-umin)/Math.max(1e-6,umax-umin); const r=Math.round(90+t*125), g=Math.round(170-t*120), b=Math.round(150-t*90); return `rgb(${r},${g},${b})`; };
  let o = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${CITIES[ck].name}各區房價地圖" style="display:block;width:100%;height:auto;background:var(--soft)">`;
  o += `<text x="10" y="18" font-size="11" fill="var(--muted)">圓越大、越紅＝單價越高（萬/坪）</text>`;
  for (const p of pts){
    const x=X(p.ll[1]), y=Y(p.ll[0]), r=14+ (p.u-umin)/Math.max(1e-6,umax-umin)*14, on=p.i===sel;
    o += `<g ${clickable?`class="mapcity" data-dist="${p.i}" tabindex="0" role="button" aria-label="${p.name} ${p.u.toFixed(1)}萬每坪" style="cursor:pointer"`:''}>
      <circle cx="${x}" cy="${y}" r="${r}" fill="${col(p.u)}" opacity="${on?1:0.78}" stroke="${on?'var(--ink)':'#fff'}" stroke-width="${on?3:1.5}"/>
      <text x="${x}" y="${y+4}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" style="font-family:'Barlow Condensed',sans-serif">${p.u.toFixed(0)}</text>
      <text x="${x}" y="${y+r+13}" text-anchor="middle" font-size="12" font-weight="${on?900:700}" fill="var(--ink)">${p.name}</text></g>`;
  }
  return o + `</svg>`;
}

    <p class="meta" style="margin:6px 0 0" id="${id}n">${road?'正在載入道路資料……':clickable?'點選地圖上的行政區即可切換；顏色越紅代表單價越高。':''}</p>

function initMap(id, ck, di, clickable, road){
  const el = document.getElementById(id); if (!el) return;
  if (!window.L){ el.outerHTML = `<div class="mapbox">${priceMapSVG(ck, di, clickable)}</div>`; return; }
  // 不使用街道底圖：只畫行政區界、區內主要道路與標的道路，不會顯示任何建物
  const map = L.map(el, {scrollWheelZoom:false, zoomSnap:0.25, maxZoom:16, minZoom:9, attributionControl:true});
  map.attributionControl.setPrefix(false);
  map.attributionControl.addAttribution('行政區界：內政部國土測繪中心｜道路：© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a>');
  MAPS[id] = {map, scope: road ? 'modal' : 'main'};
  const counties = cityCounties(ck);
  const game = CITIES[ck].dists.map((d,i)=>({i, key:townKey(ck,d[0]), u:unitNow(ck,i)}));
  const us = game.map(g=>g.u), umin=Math.min(...us), umax=Math.max(...us);
  const col = u => { const t=(u-umin)/Math.max(1e-6,umax-umin); return `rgb(${Math.round(90+t*125)},${Math.round(170-t*120)},${Math.round(150-t*90)})`; };
  const sel = townKey(ck, CITIES[ck].dists[di][0]);
  let selLayer = null; const gameLayers = [];
  for (const f of TOWNS){
    if (!counties.includes(f.c)) continue;
    const g = game.find(x=>x.key[0]===f.c && x.key[1]===f.t);
    const isSel = f.c===sel[0] && f.t===sel[1];
    const ll = f.g.map(poly=>poly.map(ring=>ring.map(([x,y])=>[y,x])));
    const style = isSel ? {color:'#d7263d', weight:3.5, fillColor:'#ffd23f', fillOpacity:0.18}
      : g ? {color:'#6f7a80', weight:1.2, fillColor:col(g.u), fillOpacity: road?0.08:0.28}
      : {color:'#b3babe', weight:0.7, fillColor:'#dde1e3', fillOpacity:0.15, interactive:false};
    const layer = L.polygon(ll, style).addTo(map);
    if (g){
      layer.bindTooltip(`${f.t}　${g.u.toFixed(1)} 萬/坪`, {sticky:true});
      if (clickable && !isSel){ layer.on('click', ()=>{ S.dist=g.i; render(); }); layer.on('mouseover', ()=>layer.setStyle({fillOpacity:0.5})); layer.on('mouseout', ()=>layer.setStyle({fillOpacity:0.28})); }
      gameLayers.push(layer);
    }
    if (isSel) selLayer = layer;
  }
  const fit = () => { try{ map.fitBounds((road||!clickable) && selLayer ? selLayer.getBounds() : L.featureGroup(gameLayers).getBounds(), {padding:[6,6]}); }catch(e){ map.setView(GEO[ck][CITIES[ck].dists[di][0]], 12); } };
  fit(); setTimeout(()=>{ map.invalidateSize(); fit(); }, 60);
  if (!selLayer) return;
  if (!road) selLayer.bindTooltip(CITIES[ck].dists[di][0], {permanent:true, direction:'center', className:'distlbl'}).openTooltip();
  const roadPane = map.createPane('roads'); roadPane.style.zIndex = 450; roadPane.style.pointerEvents = 'none';
  const hiPane = map.createPane('hi'); hiPane.style.zIndex = 460;
  const dist = CITIES[ck].dists[di][0];
  const note = () => document.getElementById(id+'n');
  const drawMajor = () => loadMajor(ck, di, selLayer.getBounds()).then(ways=>{
    if (!MAPS[id] || !ways) return;
    for (const w of ways){ const wt = w.k<=1?4:w.k===2?3:2; L.polyline(w.p, {pane:'roads', color:w.k<=1?'#e8a23a':'#9aa3a8', weight:wt, opacity:0.9, interactive:false}).addTo(map); }
  });
  if (!road){ drawMajor(); return; }
  const tryRoad = (attempt) => {
    const n = note(); if (n) n.textContent = attempt ? `重新載入「${road}」道路資料中……` : `正在載入「${road}」道路資料……`;
    loadRoad(ck, di, road, selLayer.getBounds()).then(res=>{
      if (!MAPS[id]) return; const n = note();
      if (res && res.lines && res.lines.length){
        const pl = L.polyline(res.lines, {pane:'hi', color:'#d7263d', weight:7, opacity:0.9, lineCap:'round'}).addTo(map);
        pl.bindTooltip(road, {permanent:true, direction:'top', className:'roadlbl'}).openTooltip();
        if (n) n.textContent = `紅色粗線為${dist}的「${road}」整條道路；地圖不標示任何建物或門牌（物件為虛構）。`;
      } else if (n){
        const why = res && res.err==='none' ? `OpenStreetMap 上查不到「${road}」，地圖僅標示${dist}的行政區界。`
          : res && res.err==='offline' ? '目前環境無法連線到道路資料服務（例如預覽模式或網路受限），地圖僅標示行政區界。'
          : '道路資料服務目前忙碌，地圖暫時只標示行政區界。';
        n.innerHTML = esc(why) + (res && res.err!=='none' && attempt<2 ? ' <button class="btn sm ghost" type="button">重試</button>' : '');
        const b = n.querySelector('button'); if (b) b.onclick = () => tryRoad(attempt+1);
      }
      drawMajor();
    });
  };
  tryRoad(0);
}
const majorMem = {};
async function loadMajor(ck, di, b){
  const key = 'major:'+ck+':'+CITIES[ck].dists[di][0];
  if (majorMem[key]!==undefined) return majorMem[key];
  try{ const v=localStorage.getItem(key); if (v!=null){ majorMem[key]=JSON.parse(v); return majorMem[key]; } }catch(e){}
  const bb = `${b.getSouth().toFixed(4)},${b.getWest().toFixed(4)},${b.getNorth().toFixed(4)},${b.getEast().toFixed(4)}`;
  const q = `[out:json][timeout:25];way["highway"~"^(motorway|trunk|primary|secondary)$"](${bb});out geom;`;
  const r = await overpass(q); if (!r.data) return null; const j = r.data;
  const rank = {motorway:0,trunk:1,primary:2,secondary:3};
  const ways = (j.elements||[]).filter(e=>e.geometry).map(e=>({k:rank[e.tags&&e.tags.highway]??3, p:e.geometry.map(p=>[+p.lat.toFixed(4), +p.lon.toFixed(4)])}));
  majorMem[key] = ways; try{ localStorage.setItem(key, JSON.stringify(ways)); }catch(e){}

  const wait = Math.max(0, roadLast + 1100 - Date.now()); roadLast = Date.now() + wait;
  if (wait) await new Promise(r=>setTimeout(r, wait));
  const ctl = ('AbortController' in window) ? new AbortController() : null;
  const tm = ctl ? setTimeout(()=>ctl.abort(), 25000) : 0;
  try{
    const r = await fetch('https://overpass-api.de/api/interpreter', {method:'POST', body:'data='+encodeURIComponent(q), headers:{'Content-Type':'application/x-www-form-urlencoded'}, signal: ctl?ctl.signal:undefined});
    clearTimeout(tm);
    if (!r.ok){ if (r.status===429) roadCool = Date.now()+60000; return {err:'busy'}; }
    return {data: await r.json()};
  }catch(e){ clearTimeout(tm); return {err: (e && e.name==='AbortError') ? 'busy' : 'offline'}; }
}
// 標的道路：OpenStreetMap Overpass API（只在玩家打開物件時查詢一次、結果快取在瀏覽器、間隔至少一秒）
const roadMem = {};
async function loadRoad(ck, di, road, b){
  const key = 'road:'+ck+':'+CITIES[ck].dists[di][0]+':'+road;
  if (roadMem[key]!==undefined) return roadMem[key];
  try{ const v=localStorage.getItem(key); if (v!=null){ let o=JSON.parse(v); if (Array.isArray(o)) o = o.length?{lines:o}:{err:'none'}; roadMem[key]=o; return o; } }catch(e){}
  const bb = `${(b.getSouth()-0.005).toFixed(4)},${(b.getWest()-0.005).toFixed(4)},${(b.getNorth()+0.005).toFixed(4)},${(b.getEast()+0.005).toFixed(4)}`;
  const q = `[out:json][timeout:20];way["highway"]["name"~"^${road.replace(/[.*+?^${}()|[\]\\"]/g,'')}"](${bb});out geom;`;
  const r = await overpass(q); if (!r.data) return {err:r.err};
  const lines = (r.data.elements||[]).filter(e=>e.geometry).map(e=>e.geometry.map(p=>[+p.lat.toFixed(5), +p.lon.toFixed(5)]));
  const res = lines.length ? {lines} : {err:'none'};
  roadMem[key] = res; try{ localStorage.setItem(key, JSON.stringify(res)); }catch(e){}
  return res;
}

function monthlyLoan(p){ const l=p.loan; if(!l||l.balance<=0) return 0; const m=S.t-l.start; const r=l.rate/100/12; if (m < l.grace*12) return l.balance*r; const left = l.years*12 - m; return left>0 ? pmt(l.balance,l.rate,left/12) : l.balance; }
function existingPayments(){ return S.props.reduce((s,p)=>s+monthlyLoan(p),0); }
function rentIncome(){ return S.props.reduce((s,p)=>s+(p.status==='出租'?p.rent:0),0); }
function mgmtFee(p){ return (p.L.type==='電梯大樓'||p.L.type==='華廈') ? Math.round(p.L.ping*(p.L.ck==='tp'?90:65)) : 0; }
function selfUse(){ return S.props.some(p=>p.status==='自住'); }
function monthlyFlow(){
  let f = S.income - S.living - (selfUse()?0:S.rentHome);
  for (const p of S.props){ f -= monthlyLoan(p) + mgmtFee(p); if (p.status==='出租') f += p.rent; }
  return Math.round(f);
}
function netWorth(){ return S.cash + S.props.reduce((s,p)=>s+valueOf(p.L)-(p.loan?p.loan.balance:0),0); }
function jcicCount(){ return S.jcic.filter(t=>S.t-t<3).length; }
function loanCase(price, L){
  // 依央行歷次選擇性信用管制整理（簡化版）：2010/6、2010/12、2012/6、2014/6、2015/8、2016/3、2020/12、2021/3、2021/9、2021/12、2023/6、2024/6、2024/9、2026/3、2026/9
  const n = S.props.length, a = absOf(S.t), A=(y,m)=>y*12+m-1;
  const hiLine = a>=A(2020,12) ? CITIES[L.ck].high : (L.ck==='tp'?8000:L.ck==='nt'?5000:4000);
  const high = price >= hiLine*10000;
  const maxY1 = a>=A(2023,8) && a<A(2026,8) ? 40 : 30;
  const first = {label:'首購自住（名下無房）', cap:0.8, grace:true, maxY:maxY1};
  const hiLbl = `高價住宅（${CITIES[L.ck].name}總價 ${hiLine} 萬以上）`;
  const nth = `自然人第${n+1}戶`;
  const sp = L.ck==='tp'||L.ck==='nt';   // 2010～2016 的特定地區以雙北為主（簡化）
  let era, r;
  if (a < A(2010,6)){ era='尚未實施選擇性信用管制';
    r = n===0&&!high ? first : {label:high?hiLbl:nth, cap:0.8, grace:true, maxY:30}; }
  else if (a < A(2016,3)){
    era = a<A(2010,12)?'央行2010年6月首波信用管制' : a<A(2012,6)?'央行2010年12月第二波信用管制' : a<A(2014,6)?'央行2012年6月第三波信用管制' : a<A(2015,8)?'央行2014年6月第四波信用管制':'央行2015年8月部分鬆綁後規定';
    const spCap = a<A(2010,12)?0.7 : (a>=A(2014,6)&&a<A(2015,8))?0.5 : 0.6;
    if (high && a>=A(2012,6)) r={label:hiLbl, cap:(a>=A(2014,6)&&a<A(2015,8))?0.5:0.6, grace:false, maxY:30};
    else if (n===0) r=first;
    else if (n>=2 && a>=A(2014,6) && a<A(2015,8)) r={label:`${nth}（全國第三戶以上）`, cap:0.5, grace:false, maxY:30};
    else if (sp) r={label:`特定地區（雙北）${nth}`, cap:spCap, grace:false, maxY:30};
    else r={label:nth, cap:0.8, grace:true, maxY:30}; }
  else if (a < A(2020,12)){ era='2016年3月解除管制，僅保留高價住宅規定';
    r = high?{label:hiLbl,cap:0.6,grace:false,maxY:30} : n===0?first : {label:nth,cap:0.8,grace:true,maxY:30}; }
  else if (a < A(2023,6)){
    era = a<A(2021,3)?'央行2020年12月信用管制' : a<A(2021,9)?'央行2021年3月第二波信用管制' : a<A(2021,12)?'央行2021年9月第三波信用管制':'央行2021年12月第四波信用管制';
    const hiCap = a<A(2021,3)?0.6 : a<A(2021,12)?(n>=3?0.4:0.55) : 0.4;
    const n3Cap = a<A(2021,3)?0.6 : a<A(2021,12)?(n>=3?0.5:0.55) : 0.4;
    if (high) r={label:hiLbl,cap:hiCap,grace:false,maxY:30};
    else if (n===0) r=first;
    else if (n===1) r={label:'自然人第二戶（六都＋新竹）',cap:0.8,grace:a<A(2021,9),maxY:30};
    else r={label:`${nth}（第三戶以上）`,cap:n3Cap,grace:false,maxY:30}; }
  else if (a < A(2024,9)){ era = a<A(2024,6)?'央行2023年6月第五波信用管制':'央行2024年6月第六波信用管制';
    r = high?{label:hiLbl,cap:0.4,grace:false,maxY:30} : n===0?first : n===1?{label:'自然人第二戶（六都＋新竹）',cap:a>=A(2024,6)?0.6:0.7,grace:false,maxY:30} : {label:`${nth}（第三戶以上）`,cap:0.4,grace:false,maxY:30}; }
  else { era = a<A(2026,2)?'央行2024年9月第七波信用管制' : a<A(2026,8)?'央行2026年3月調整後規定':'央行2026年9月調整後規定';
    const c2 = a>=A(2026,8)?0.7 : a>=A(2026,2)?0.6 : 0.5;
    r = high?{label:hiLbl,cap:0.3,grace:false,maxY:30} : n===0?first : n===1?{label:'自然人第二戶（全國）',cap:c2,grace:false,maxY:30} : {label:`${nth}（第三戶以上）`,cap:0.3,grace:false,maxY:30}; }
  return {...r, era};
}

const STEPS = [
  {t:'找物件',tip:'選擇縣市與行政區，比較物件開價和區域行情，挑出想看的房子。'},
  {t:'實地看屋',tip:'看屋可以發現漏水、壁癌等問題，也能了解屋主的個性和賣屋原因，這些都是議價籌碼。'},
  {t:'議價',tip:'用有根據的理由（實價登錄、屋況問題、付款誠意）爭取降價，也要留意屋主或仲介的話術，別把屋主惹毛。'},
  {t:'申請房貸',tip:'比較不同銀行的成數、利率、年限與附加條件。每諮詢一家就會查一次聯徵，查太多次利率會被加碼。'},
  {t:'簽約交屋',tip:'確認自備款與各項稅費都準備好，簽約用印、完稅、過戶設定、銀行撥款後點交。'}
];
function stepper(cur, withTip=true){
  return `<div class="steps" aria-label="購屋流程：第 ${cur} 步，共 5 步">${STEPS.map((st,i)=>{ const n=i+1; const c = n<cur?'done':n===cur?'cur':''; return `<div class="step ${c}"><i>${n<cur?'✓':n}</i><b>${st.t}</b></div>`; }).join('')}</div>`
    + (withTip?`<div class="steptip"><b>Step ${cur}　${STEPS[cur-1].t}</b>：${STEPS[cur-1].tip}</div>`:'');
}
// ======================= LISTING DETAIL =======================
function openListing(id){
  const L = listing(id); if (!L) return;
  const seen = S.seen[id], v = valueOf(L), unit = unitNow(L.ck,L.di);
  const blocked = S.blocked[id] && S.blocked[id]>S.t;
  const P = PERS[L.seller.pers];
  const md = modal(`${stepper(seen?3:2)}<h2>${esc(titleOf(L))}</h2><p class="sub">${L.agent?'仲介代銷（買方服務費 1%）':'屋主自售（免仲介費）'}・刊登於 ${dateStr(L.listedAt)}</p>
    <div class="two"><div>${mapHTML(L.ck, L.di, false, L.road)}<p class="meta" style="margin:4px 0 0">物件位置：${esc(cityName(L)+L.road)}一帶（虛構物件，與實際建物無關）</p></div>
    <div><div class="price n" style="font-size:40px">${W(L.ask)}<small>萬</small></div>
      <table class="t"><tr><td>權狀坪數</td><td>${L.ping} 坪（室內約 ${inPing(L)} 坪）</td></tr><tr><td>開價單價</td><td>${(L.ask/10000/L.ping).toFixed(1)} 萬/坪</td></tr><tr><td>類型／屋齡</td><td>${L.type}・${L.age} 年</td></tr><tr><td>樓層</td><td>${L.type==='透天'?`${L.total} 層透天`:`${L.floor} 樓／共 ${L.total} 樓`}</td></tr><tr><td>格局</td><td>${L.rooms}</td></tr><tr><td>車位</td><td>${L.parking?'坡道平面車位':'無'}</td></tr>
      <tr><td>區域均價</td><td>${unit.toFixed(1)} 萬/坪</td></tr><tr><td>實價登錄參考區間</td><td>${W(v*0.95)}～${W(v*1.04)} 萬</td></tr></table></div></div>
    <h3 style="margin:16px 0 6px">看屋紀錄</h3>
    ${seen?`<div class="note"><b>屋主：${L.seller.name}（${L.seller.age}歲）</b>・個性印象：<b>${P.label}</b>，${P.desc}。<br>賣屋原因：${L.seller.reason}。<br>屋況：${L.cond}/100　${L.issues.length?`發現問題：<b style="color:var(--red)">${L.issues.join('、')}</b>`:'沒有發現明顯問題。'}</div>`
          :`<div class="note">還沒去看過這間房子。實地看屋可以了解屋況、發現隱藏問題，也能跟屋主聊聊，摸清對方的個性與賣屋原因。</div>`}
    ${blocked?`<p class="warn" style="margin-top:10px">上次議價讓屋主很不愉快，他說 ${S.blocked[id]-S.t} 個月內不想再跟你談。</p>`:''}
    <div class="foot">${seen?'':'<button class="btn red" id="viewBtn">Step 2 預約看屋</button>'}<button class="btn ${seen?'red':'ghost'}" id="negoBtn" ${blocked?'disabled':''}>${seen?'Step 3 開始議價 ▶':'跳過看屋直接議價'}</button></div>`);
  const vb = md.querySelector('#viewBtn'); vb && (vb.onclick=()=>{ S.seen[id]=true; addLog(`到 ${titleOf(L)} 看屋。`); save(); openListing(id); toast('看屋完成，屋況與屋主資訊已記錄'); });
  md.querySelector('#negoBtn').onclick=()=>openNego(id);
}

// ======================= SELLER NEGOTIATION =======================
let SAMPLE = null, aiOn = false;
function setAI(on){ aiOn = on && !!SAMPLE; const b=$('#aiBadge'); b.textContent = aiOn?'AI 對談模式：自由話術':'經典對談模式'; b.classList.toggle('on',aiOn); }
if (inClaude){ window.claude.use('sample').then(s=>{ if (s){ SAMPLE=s; setAI(true); } }).catch(()=>{}); }
async function ai(prompt){
  try { return await SAMPLE.json(prompt,{modelTier:'quick',cache:false}); }
  catch(e){ if (e && (e.code==='not_granted')) { SAMPLE=null; setAI(false); toast('未授權 AI，已切換為經典對談模式'); } return null; }
}
function detect(text, KW){ const hits=[]; for (const k in KW) if (KW[k].some(w=>text.includes(w))) hits.push(k); return hits; }
function tacticText(id, L){
  const unit = (unitNow(L.ck,L.di)*TYPES[L.type].f*ageF(L.age,L.type)).toFixed(1);
  return {data:`我查過實價登錄，這附近同類型最近成交大概一坪 ${unit} 萬左右，您的開價偏高了。`,
    issue: L.issues.length && S.seen[L.id] ? `看屋時發現有${L.issues.slice(0,2).join('和')}的問題，之後整修至少要花好幾十萬。` : '我覺得屋況有些地方要整修，會花不少錢。',
    cash:'我的貸款已經預審過，自備款也準備好了，可以很快完成交屋。', deposit:'我願意先付 10 萬斡旋金，表示我的誠意。',
    budget:'我是真的有誠意要買，但預算就只有這樣，再多家人不會答應。', compare:'我同時還在看附近另一個社區，那邊單坪開價更低。',
    market:`現在房市景氣不好，實價登錄我都看過了，高於 ${W(Math.min(L.nego?.lastAsk||L.ask, valueOf(L))*0.97)} 萬我就不考慮了。`,
    patience:'我不急，這間沒談成也沒關係，我可以慢慢等下一個適合的。',
    callbluff:'您說已經有人下斡旋，方便讓我看一下斡旋書或要約書嗎？',
    praise:'這房子您真的照顧得很好，我們一家人都很喜歡這裡的感覺。', flaws:'這間格局我不太喜歡，採光也有點差，買了還要花大錢裝潢。',
    deadline:'如果今天這個價格可以，我馬上就簽，過了今天我就去看別間了。', lowball:'我直接講，這個價格打七折我就買。'}[id];
}
function openNego(id){
  const L = listing(id); const P = PERS[L.seller.pers];
  const N = L.nego || (L.nego = {mood:L.seller.mood, lastAsk:L.ask, lastOffer:0, persuade:0, used:{}, hist:[], round:0, done:false});
  const md = modal(`${stepper(3)}<h2>議價：${esc(L.road)} ${L.type}</h2><p class="sub">${L.agent?'由仲介居中斡旋，屋主會親自到場談':'屋主自售，直接和屋主面對面談'}　${aiOn?'・<b>AI 對談模式</b>：可以輸入任何話術':'・經典模式：依關鍵字判斷話術'}</p>
  <div class="nego"><div class="side">
    <div class="who"><div class="avatar" style="background:${['#d7263d','#2f5bd3','#17805a','#8a5cc7','#c9704f'][L.seller.name.length%5]}">${L.seller.name[0]}</div><div><b>${L.seller.name}</b><div class="meta">${S.seen[id]?`${P.label}・${L.seller.age}歲`:'個性未知（看屋可得知）'}</div></div></div>
    <div><div class="meta">屋主情緒</div><div class="meter"><i id="moodBar"></i></div></div>
    <div><div class="meta">屋主目前開價</div><div class="bigprice n" id="askNow"></div></div>
    <div><div class="meta">你上次出價</div><div class="n" style="font-size:22px" id="offNow"></div></div>
    <div class="note">參考行情：${W(valueOf(L)*0.95)}～${W(valueOf(L)*1.04)} 萬<br>你的現金：${W(S.cash)} 萬${S.seen[id]&&L.issues.length?`<br>看屋發現：${L.issues.join('、')}`:''}</div>
    <div class="warn" id="rivalBox" style="display:none"></div>
    ${SAMPLE?`<label class="meta" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="aiTog" ${aiOn?'checked':''}> 使用 AI 對談</label>`:''}
    <details class="note"><summary><b>話術小抄</b></summary>
      <p style="margin:6px 0 4px"><b>賣方／仲介常用</b></p>
      「已經有人下斡旋」→ 製造競爭焦慮，可要求看斡旋書<br>「忍痛割愛才賣」→ 可能在掩飾缺點<br>「好戶只剩這間」→ 限時限量逼你決定<br>「屋主不缺錢」→ 定錨，擋掉大砍價<br>「未來有重大建設」→ 畫大餅合理化高價<br>「我用服務費拜託屋主」→ 博取信任，要你加價
      <p style="margin:8px 0 4px"><b>買方常用</b></p>
      嫌貨才是買貨人、悲情牌預算封頂、同時在看別的社區、以景氣與實價登錄定錨、表現不急
      <p style="margin:8px 0 4px"><b>專家建議</b></p>
      以實價登錄為骨幹、以時間為籌碼；守住自己的預算底線；看到喜歡的物件別顯露過度興奮。
    </details>
  </div>
  <div><div class="chat" id="chat" aria-live="polite"></div>
    <div class="tact" id="tact">${SELLER_T.map(t=>`<button data-t="${t.id}" class="${N.used[t.id]?'used':''}">${t.label}</button>`).join('')}</div>
    <div class="inrow"><textarea id="say" placeholder="輸入你想對屋主說的話……（可以用上面的話術，也可以自由發揮）"></textarea>
      <div class="offer">出價（萬，可留空）<input id="off" type="number" inputmode="numeric" min="0" step="10"></div></div>
    <div class="foot" style="margin-top:10px"><button class="btn ghost" id="quit">放棄</button><button class="btn yel" id="acceptAsk">接受屋主開價</button><button class="btn red" id="send">送出</button></div>
  </div></div>`, true);
  const chat = md.querySelector('#chat');
  const upd = () => {
    const mb = md.querySelector('#moodBar'); mb.style.width = clamp(N.mood,0,100)+'%'; mb.style.background = N.mood>55?'var(--green)':N.mood>30?'#e0a31a':'var(--red)';
    md.querySelector('#askNow').textContent = W(N.lastAsk)+' 萬';
    md.querySelector('#offNow').textContent = N.lastOffer ? W(N.lastOffer)+' 萬' : '—';
    const rb = md.querySelector('#rivalBox'); rb.style.display = N.rival&&!N.done ? '' : 'none';
    if (N.rival) rb.textContent = `⚠️ 對方聲稱已有其他買方下斡旋（真假未知），剩 ${N.rival.turns} 回合。可以加價、要求看斡旋書，或賭它是話術。`;
  };
  const bubble = (who, text, off) => { const d=document.createElement('div'); d.className='msg '+who; d.textContent=text; if (off){ const o=document.createElement('div'); o.className='off'; o.textContent=`出價 ${W(off)} 萬`; d.appendChild(document.createElement('br')); d.appendChild(o);} chat.appendChild(d); chat.scrollTop=chat.scrollHeight; };
  if (!N.hist.length){
    const open = {rush:'你好你好，房子你也看過了，價格好談，誠意夠就可以。',stubborn:'這房子我住了幾十年，每個角落都顧得很好，價格我是很實在的。',investor:'你好，開價是參考行情訂的，有誠意的話我們就看數字談。',emotional:'你好～房子我很喜歡，要不是不得已也不想賣。你覺得怎麼樣？',heir:'你好，這間是家裡長輩留下來的，我們幾個兄弟姊妹都想早點處理。'}[L.seller.pers];
    N.hist.push({who:'them',text:open});
  }
  N.hist.forEach(h=>bubble(h.who,h.text,h.off));
  upd();
  md.querySelectorAll('#tact button').forEach(b=>b.onclick=()=>{ const ta=md.querySelector('#say'); ta.value = (ta.value?ta.value+'\n':'')+tacticText(b.dataset.t,L); ta.focus(); });
  const tog = md.querySelector('#aiTog'); tog && (tog.onchange=()=>{ setAI(tog.checked); });
  md.querySelector('#quit').onclick = ()=>{ delete md.dataset.lock; closeModal(); };
  md.querySelector('#acceptAsk').onclick = ()=>{ if (N.done) return; N.done=true; bubble('me','好，就照您的價格。',N.lastAsk); bubble('them','爽快！那我們就這樣說定了。'); dealAgreed(L, N.lastAsk); };
  const send = async () => {
    if (N.done) return;
    const text = md.querySelector('#say').value.trim();
    const offW = parseFloat(md.querySelector('#off').value);
    const offer = offW>0 ? Math.round(offW*10000) : 0;
    if (!text && !offer){ toast('先說點什麼或出個價吧'); return; }
    if (offer && offer >= N.lastAsk){ bubble('me',text||'好，就這個價格。',offer); N.hist.push({who:'me',text:text||'',off:offer}); N.done=true; bubble('them','沒問題！那就這樣成交。'); dealAgreed(L, N.lastAsk); return; }
    bubble('me', text||'（直接出價）', offer); N.hist.push({who:'me',text,off:offer});
    md.querySelector('#say').value=''; md.querySelector('#off').value='';
    const sendBtn = md.querySelector('#send'); sendBtn.disabled=true;
    const thinking = document.createElement('div'); thinking.className='msg sys'; thinking.textContent = `${L.seller.name}正在思考……`; chat.appendChild(thinking); chat.scrollTop=chat.scrollHeight;
    N.round++;
    const bluffNote = KW_SELLER.callbluff.some(w=>text.includes(w)) ? resolveBluff(L,N,bubble) : '';
    let res = null;
    if (aiOn && SAMPLE) res = await sellerAI(L,N,text,offer,bluffNote);
    if (!res) res = sellerLocal(L,N,text,offer);
    thinking.remove(); sendBtn.disabled=false;
    applySeller(L,N,res,offer,bubble);
    upd(); save();
  };
  md.querySelector('#send').onclick = send;
  md.querySelector('#say').addEventListener('keydown', e=>{ if (e.key==='Enter' && (e.ctrlKey||e.metaKey)) send(); });
  if (N.agreed) showAgreed(L, N.agreed);
}
function effReserve(L,N){ return Math.round(valueOf(L)*L.seller.resF*(1-Math.min(0.06,N.persuade*0.008))); }
function resolveBluff(L,N,bubble){
  const who = L.agent?'仲介':'屋主';
  if (N.rival){
    if (!N.rival.real){ N.persuade=Math.min(8,N.persuade+2); N.mood-=3; N.rival=null; bubble('sys',`${who}支支吾吾拿不出斡旋書，「有人下斡旋」看來只是話術，屋主氣勢弱了下來。`); return '買方要求看斡旋書，你們拿不出來，「有人下斡旋」的話術被識破了，你有點心虛尷尬。'; }
    bubble('sys',`${who}拿出斡旋書影本（買方個資與金額都已遮蔽），確實有另一組買方出價。`); return '買方要求看斡旋書，你們拿出來了，確實有另一組買方，你的立場更硬了。';
  }
  N.mood-=4; bubble('sys','根本沒人提過有其他買方，對方覺得被懷疑。'); return '買方莫名懷疑你們說謊，你有點不高興。';
}
function pressureLine(L,code){
  const pre = L.agent?'【仲介】':'';
  return pre + ({rival:'這間已經有人下斡旋了，你要不要加一點直接攔截？',
    emigrate:`屋主是因為${L.seller.reason}才忍痛割愛，不然根本捨不得賣。`,
    scarce: L.type==='透天'?'這一排透天就剩這一戶在賣，再不決定就沒了。':'這個社區這種好戶別只剩這一間，再不決定就沒了。',
    notneedy:'屋主其實不缺錢，他在等一個有緣人，價格太低他寧願放著。',
    future:'這邊未來有捷運跟重大建設，現在買以後一定增值。'})[code];
}
async function sellerAI(L,N,text,offer,bluffNote){
  const P = PERS[L.seller.pers], res = effReserve(L,N);
  const hist = N.hist.slice(-10).map(h=>`${h.who==='me'?'買方':'屋主'}：${h.text||''}${h.off?`（出價 ${W(h.off)} 萬）`:''}`).join('\n');
  const prompt = `你正在一款台灣房地產模擬遊戲中扮演「賣方屋主」NPC，請完全以角色身分回應。
【屋主】${L.seller.name}，${L.seller.age}歲，個性：${P.label}（${P.desc}）。賣屋原因：${L.seller.reason}。
【物件】${titleOf(L)}，權狀 ${L.ping} 坪，屋齡 ${L.age} 年，${L.type==='透天'?L.total+'層透天':L.floor+'/'+L.total+'樓'}，${L.rooms}${L.parking?'，含車位':''}。
【你目前的開價】${W(N.lastAsk)} 萬
【你心中的底價】${W(res)} 萬（絕對不可說出或暗示這個數字）
【行情】區域實價登錄均價每坪約 ${unitNow(L.ck,L.di).toFixed(1)} 萬，本物件合理成交行情約 ${W(valueOf(L))} 萬。
【實際存在的屋況問題】${L.issues.length?L.issues.join('、'):'無'}（${S.seen[L.id]?'買方有來看過屋':'買方沒有來看過屋'}；若買方提到不在清單上的問題，代表他在亂講）
【目前情緒】${N.mood}/100（越低越不耐煩，0 代表不想賣給他）
【已談回合】${N.round}
【對話紀錄】
${hist}
${bluffNote?`【剛剛發生】${bluffNote}\n`:''}${N.rival?`【你們先前說過有其他買方下斡旋】${N.rival.real?'這是真的':'其實是話術'}\n`:''}
買方常用話術與其用意（用來判斷真假）：嫌貨才是買貨人（挑缺點當籌碼）、悲情牌預算封頂、同時在看別的社區、以景氣與實價登錄理性定錨、表現不急以時間為籌碼。
你或居中的仲介也可以適時使用賣方話術：已經有人下斡旋（rival）、因故忍痛割愛（emigrate）、好戶只剩這間（scarce）、屋主不缺錢寧願放著（notneedy）、未來有重大建設一定增值（future）。${L.agent?'有仲介在場，這類話可以由仲介來說，在 reply 裡用「【仲介】」開頭標示。':''}

依照你的個性評估買方最新這句話的說服力：有根據的理由（實價登錄、真實存在的屋況問題、付款誠意、快速交屋）能讓你稍微鬆動；無理砍價、羞辱、說謊、施壓會讓你不高興。
規則：
1. 出價 ≥ 底價才可以 accept。
2. 出價低於底價用 counter，counter_price（單位：萬）必須介於底價與目前開價之間，依個性決定讓步幅度，不要一次讓太多。
3. 這次沒有出價時 decision 用 "talk"（可以反問、試探）。
4. 情緒很差或買方太過分時可以 walkaway 結束談判。
5. reply 用台灣口語繁體中文，1 到 3 句，貼合個性，不要提到遊戲、AI 或底價數字。
6. 不要重複你在對話紀錄裡說過的句子或開頭，語氣要自然有變化；可以回應買方話中的細節、反問、帶點情緒或生活感。
7. 買方問到管理費、鄰居、學區、交通、屋況、賣屋原因、交屋時間、家具家電等問題時，依你的個性回答（誠實、含糊帶過或避重就輕都可以），但不能捏造與上面設定矛盾的事實。

function maxLoanDBR(years, rate, guarantor){
  const cap = S.income*(guarantor?0.7:0.6) + rentIncome()*0.7 - existingPayments();
  if (cap<=0) return 0;
  const r=rate/100/12, n=years*12; return Math.max(0, Math.round(cap*(1-Math.pow(1+r,-n))/r));
}

function bankLocal(deal,bank,B,C,text){
  const hits = detect(text, KW_BANK); const out = {ltv:B.ltv, rate:B.rate, years:B.years, grace:B.grace, fee:B.fee, conds:null, trust:0}; const said=[];
  const say = (k, rep={}) => { let t = sayOne(BANK_SAY[k], B); for (const x in rep) t=t.replace('{'+x+'}', rep[x]); said.push(t); };
  const addCond = (t,cost)=>{ const c=[...B.conds]; if(!c.some(x=>x.text===t)) c.push({text:t,cost}); out.conds=c; };
  if (B.trust<35 && Math.random()<0.6) said.push(sayOne(TRUST_PRE.low,B)); else if (B.trust>75 && Math.random()<0.4) said.push(sayOne(TRUST_PRE.high,B));
  for (const h of hits){
    if (B.used[h]){ out.trust-=2; say('repeat'); continue; }
    B.used[h]=true;
    if (h==='stable'){ out.rate-=0.03; out.trust+=5; if (!S.props.length) out.ltv+=2; say('stable'); }
    if (h==='assets'){ if (S.cash > deal.price*0.25){ out.ltv+=3; out.rate-=0.03; out.trust+=5; say('assetsOk'); } else { out.trust-=3; say('assetsNo'); } }
    if (h==='payroll'){ out.rate-=0.06; addCond('夫妻薪轉帳戶與信用卡轉至本行',0); say('payroll'); }
    if (h==='compare'){ const o = otherOffers(deal,bank.id); if (o.length){ const best = o.reduce((a,b)=>a.rate<b.rate?a:b); out.rate = Math.min(out.rate, best.rate+0.03); out.ltv = Math.max(out.ltv, Math.max(...o.map(x=>x.ltv))-2); say('compareOk',{bank:best.name}); } else { out.trust-=6; say('compareNo'); } }
    if (h==='insurance'){ out.ltv+=5; addCond('投保房貸壽險（躉繳）', Math.round(Math.min(deal.price,B.appraisal)*B.ltv/100*0.012)); say('insurance'); }
    if (h==='grace'){ if (C.grace){ out.grace = B.trust>60?3:2; say('graceOk',{g:out.grace}); } else say('graceNo'); }
    if (h==='longer'){ if (C.maxY>=40){ out.years=40; say('longerOk'); } else say('longerNo'); }
    if (h==='guarantor'){ B.guarantor=true; out.ltv+=3; out.trust+=3; addCond('父母擔任連帶保證人',0); say('guarantor'); }
  }
  const social = Object.values(BANK_SOCIAL).find(v=>v.kw.some(w=>text.includes(w)));
  if (social){ said.unshift(sayOne(social.say,B)); out.trust += social.trust; }
  const qa = BANK_QA.find(q=>q.kw.some(w=>text.includes(w)));
  if (qa) said.push(sayOne(qa.a(B,C),B));
  if (!hits.length && !qa && !social) said.push(sayOne(BANK_IDLE[bank.id],B));
  if (Math.random()<0.18 && BANK_PITCH[bank.id]) said.push(sayOne(BANK_PITCH[bank.id],B));
  out.reply = said.filter(Boolean).join('');
  return out;
}

function applyBank(deal,bank,B,C,r){
  const base = Math.min(deal.price, B.appraisal);
  let ltv = isFinite(r.ltv)?r.ltv:B.ltv; ltv = clamp(ltv, B.ltv-5, B.ltv+5);
  let rate = isFinite(r.rate)?r.rate:B.rate; rate = clamp(rate, B.rate-0.15, B.rate+0.15);
  rate = Math.max(rate, bankFloor(bank));
  let years = clamp(r.years||B.years, 20, C.maxY);
  if (bank.id==='gov' && years>30 && C.maxY<40) years=30;
  let grace = C.grace ? clamp(r.grace||0,0,3) : 0;
  B.trust = clamp(B.trust + (r.trust||0), 0, 100);
  ltv = Math.min(ltv, C.cap*100);
  const dbrMax = maxLoanDBR(years, rate, B.guarantor);
  ltv = Math.min(ltv, Math.floor(dbrMax/base*100));
  if (B.trust<25) ltv = Math.min(ltv, B.ltv);
  B.ltv = Math.max(0, Math.round(ltv)); B.rate = +rate.toFixed(3); B.years = years; B.grace = grace;
  if (isFinite(r.fee) && r.fee>=0) B.fee = clamp(r.fee, 0, 20000);
  if (r.conds) B.conds = r.conds.filter(c=>c && c.text).slice(0,4).map(c=>({text:String(c.text).slice(0,40), cost:clamp(parseInt(c.cost)||0,0,Math.round(base*0.015))}));
}

    p.L.layout = Math.min(0.05,(p.L.layout||0)+s.reduce((a,o)=>a+(o.layout||0),0));
    p.rentBoost = (p.rentBoost||0)+s.reduce((a,o)=>a+(o.rent||0),0);
    if (s.some(o=>o.staging)) p.L.staging=true;
    s.forEach(o=>{ if (o.fix) p.L.issues = p.L.issues.filter(x=>x!==o.fix); });
    const months = Math.max(0,...s.map(o=>o.months));
    if (months){ p.prevStatus = p.status==='自住'?'自住':'空置'; p.status='裝修中'; p.renoUntil=S.t+months; }
    addLog(`${titleOf(p.L)} 裝修：${s.map(o=>o.name).join('、')}，花費 ${W1(cost)} 萬。`);
    save(); closeModal(); toast(months?`開工！約 ${months} 個月完工`:'施工完成！');
  };
}

const SALE_MODES = {
  self:{label:'自售',desc:'自己刊登在售屋平台、自己帶看。免仲介費，但曝光少、成交慢。',exp:0.32,fee:[0,0]},
  general:{label:'一般委託',desc:'可同時委託多家仲介、也能自售。賣方服務費依法上限 4%，只付給成交的那家。',exp:0.55,fee:[2,4]},
  exclusive:{label:'專任委託',desc:'委託期間只給一家仲介、不能自售。仲介會投入較多廣告與帶看。',exp:0.72,fee:[2,4]},
  joint:{label:'專任＋聯賣',desc:'簽專任並開放同業聯合銷售，曝光最大、買方來源最多，服務費通常收滿 4%。',exp:0.9,fee:[3,4]}
};
function saleEstimate(p, price, feePct){
  const fee = Math.round(price*feePct/100);
  const landTax = Math.round(price*0.004*Math.min(1,(S.t-p.boughtAt+6)/60));
  const misc = 15000 + Math.round(price*0.0003);
  const held = S.t - p.boughtAt;
  const bal = p.loan?p.loan.balance:0;
  const penalty = p.loan ? Math.round(bal*(held<12?0.01:held<24?0.005:0)) : 0;
  const gain = price - p.cost - p.reno - fee - landTax - misc;
  const selfLong = p.status==='自住' && p.selfSince!=null && S.t-p.selfSince>=72 && S.props.length===1;
  const buyA = absOf(p.boughtAt), sellA = absOf(S.t), A=(y,m)=>y*12+m-1;
  let rate=0, tax=0, taxName='', luxury=0;
  if (buyA < A(2016,1)){
    taxName='舊制財產交易所得（依評定現值，估）'; tax = Math.round(price*0.003); rate=0;
    if (sellA>=A(2011,6) && sellA<A(2016,1) && held<24 && p.status!=='自住'){ luxury = Math.round(price*(held<12?0.15:0.10)); }
  } else {
    const v2 = sellA >= A(2021,7);
    rate = v2 ? (held<=24?0.45:held<=60?0.35:held<=120?0.2:0.15) : (held<=12?0.45:held<=24?0.35:held<=120?0.2:0.15);
    taxName = v2 ? '房地合一稅2.0' : '房地合一稅1.0';
    let taxable = Math.max(0,gain);
    if (selfLong){ taxable = Math.max(0,gain-4000000); rate = 0.1; }
    tax = Math.round(taxable*rate);
  }
  tax += luxury;
  return {fee, landTax, misc, penalty, gain, tax, rate, bal, net: price - fee - landTax - misc - penalty - tax - bal, held, selfLong, taxName, luxury};
}

  md.querySelectorAll('#ask,#fee,#mon').forEach(i=>i.oninput=calc); calc();

function offerProb(p, ask, mode, fee){
  const M = SALE_MODES[mode]; const v = valueOf(p.L);
  const feeF = mode==='self'?1:Math.sqrt(fee/4);
  const priceF = Math.exp(-Math.max(0, ask/v-0.98)*9);
  const heat = 0.85 + (S.idx[p.L.ck]-1)*3;
  return clamp(M.exp*0.6*feeF*priceF*(p.L.staging?1.15:1)*(p.status==='出租'?0.8:1)*heat, 0.02, 0.8);
}
function saleOffer(p){
  const v = valueOf(p.L); const s = p.sale;
  const offer = Math.round(Math.min(s.ask, v*R(0.88,1.0))/10000)*10000;
  let buyerMax = Math.max(offer, Math.round(v*R(0.96,1.04)*(p.L.staging?1.02:1)/10000)*10000);
  const md = modal(`<h2>有買方出價了！</h2><p class="sub">${esc(titleOf(p.L))}・${s.label}・開價 ${W(s.ask)} 萬</p>
    <p style="font-size:15px">${s.mode==='self'?'一位看過房子的買方直接聯絡你：「我很有誠意，':`${s.agency}的經紀人帶來斡旋：「現在市場看屋的人變少了，這個買方是自住、自備款很足、誠意最高的一個，錯過可能要再等半年。`}出價 <b class="n" style="font-size:24px">${W(offer)} 萬</b>，已經付了斡旋金。」</p>
    <div class="note">目前估值約 ${W(v)} 萬。你可以接受、還價，或拒絕等下一組買方。還價太高，買方可能直接放棄。</div>
    <div class="field">還價（萬）<input type="number" id="ctr" value="${Math.round((offer+s.ask)/2/10000)}" step="5"></div>
    <div class="field">還價時搭配的話術<select id="stac"><option value="">不用話術，就事論事</option><option value="rival">已經有其他人出價了（製造競爭）</option><option value="future">這裡未來有重大建設（畫大餅）</option><option value="notneedy">我不缺錢，價格不到寧願放著（定錨）</option><option value="emigrate">要不是換屋也捨不得賣（合理化）</option></select></div>
    <div class="foot"><button class="btn ghost" id="rej">拒絕</button><button class="btn" id="ctrBtn">還價</button><button class="btn red" id="acc">接受 ${W(offer)} 萬</button></div>`);
  md.dataset.lock='1';
  const done = () => { delete md.dataset.lock; closeModal(); };
  md.querySelector('#rej').onclick=()=>{ addLog(`拒絕了 ${W(offer)} 萬的出價。`); done(); };
  md.querySelector('#acc').onclick=()=>{ delete md.dataset.lock; completeSale(p, offer); };
  let tacUsed = false, buyerLeft = false;
  md.querySelector('#ctrBtn').onclick=()=>{
    const c = Math.round((parseFloat(md.querySelector('#ctr').value)||0)*10000);
    const tac = md.querySelector('#stac').value;
    if (tac && !tacUsed){ tacUsed = true; const r=Math.random();
      if (tac==='rival'){ if (r<0.45) buyerMax*=1.03; else if (r<0.7) buyerLeft=true; }
      if (tac==='future') buyerMax *= S.idx[p.L.ck]>=1 ? 1.015 : 1.005;
      if (tac==='notneedy'){ if (r<0.6) buyerMax*=1.02; else if (r<0.8) buyerLeft=true; }
      if (tac==='emigrate') buyerMax *= 1.01;
      buyerMax = Math.round(buyerMax/10000)*10000;
    }
    if (buyerLeft){ addLog('買方覺得被話術施壓，決定放棄。'); md.querySelector('.note').innerHTML = '買方回覆：「既然有人出更高，那你賣給他吧。」買方放棄了。'; md.querySelector('#acc').disabled=true; md.querySelector('#ctrBtn').disabled=true; md.querySelector('#rej').textContent='關閉'; return; }
    if (c<=offer){ delete md.dataset.lock; completeSale(p, offer); return; }
    if (c<=buyerMax){ delete md.dataset.lock; toast('買方同意了你的價格！'); completeSale(p, c); }
    else if (c<=buyerMax*1.04){ const mid = Math.round((buyerMax+offer)/2/10000)*10000; md.querySelector('.note').innerHTML = `買方回覆：「${W(c)} 萬太高了，最多 <b>${W(mid)} 萬</b>，這是底線。」`; md.querySelector('#acc').textContent = `接受 ${W(mid)} 萬`; md.querySelector('#acc').onclick=()=>{ delete md.dataset.lock; completeSale(p, mid); }; md.querySelector('#ctrBtn').disabled=true; }
    else { addLog(`還價 ${W(c)} 萬，買方覺得差太多，放棄了。`); md.querySelector('.note').innerHTML = '買方覺得差距太大，已經放棄。'; md.querySelector('#acc').disabled=true; md.querySelector('#ctrBtn').disabled=true; md.querySelector('#rej').textContent='關閉'; }
  };
}
function completeSale(p, price){
  const e = saleEstimate(p, price, p.sale?p.sale.feePct:0);
  S.cash += e.net;
  S.props = S.props.filter(x=>x!==p);
  const profit = price - p.cost - p.reno - e.fee - e.landTax - e.misc - e.penalty - e.tax;
  addLog(`🎉 售出 ${titleOf(p.L)}，成交 ${W(price)} 萬，繳稅 ${W1(e.tax)} 萬，實拿 ${W(e.net)} 萬，淨利 ${profit>=0?'+':''}${W(profit)} 萬。`, profit>=0?'good':'');
  save();
  modal(`<h2>成交！</h2><p class="sub">${esc(titleOf(p.L))}</p><table class="t"><tr><td>成交價</td><td>${W(price)} 萬</td></tr><tr><td>仲介費＋稅費＋違約金</td><td>−${W1(e.fee+e.landTax+e.misc+e.penalty)} 萬</td></tr><tr><td>房地合一稅</td><td>−${W1(e.tax)} 萬</td></tr><tr><td>清償房貸</td><td>−${W(e.bal)} 萬</td></tr><tr class="total"><td>入帳現金</td><td>${W(e.net)} 萬</td></tr></table><p class="note">這筆投資的淨利（扣除買入成本、裝修、所有稅費）：<b class="${profit>=0?'up':'down'}">${profit>=0?'+':''}${W(profit)} 萬</b></p><div class="foot"><button class="btn red" id="ok">好</button></div>`).querySelector('#ok').onclick=closeModal;
}

  for (const p of S.props){

      const m = S.t-1-p.loan.start, r=p.loan.rate/100/12, interest = p.loan.balance*r;
      const pay = monthlyLoan({loan:{...p.loan, start:p.loan.start+1}}); // payment for month m
      const principal = m < p.loan.grace*12 ? 0 : Math.max(0, pay-interest);
      p.loan.balance = Math.max(0, Math.round(p.loan.balance - principal));
      flow -= Math.round(interest+principal);
    }
    flow -= mgmtFee(p);
    if (p.status==='出租') flow += p.rent;
    if (p.status==='招租中' && Math.random()<0.55){ p.status='出租'; p.rent = Math.round(valueOf(p.L)*CITIES[p.L.ck].yield/12*(1+(p.rentBoost||0))*(0.8+p.L.cond/250)/100)*100; addLog(`${titleOf(p.L)} 租出去了，月租 ${NT(p.rent)} 元。`,'good'); }
    if (p.status==='裝修中' && S.t>=p.renoUntil){ p.status = p.prevStatus||'空置'; addLog(`${titleOf(p.L)} 裝修完工！`,'good'); }
    if (d.m===5){ const tax = Math.round(valueOf(p.L)*(p.status==='自住'&&S.props.length===1?0.0006:0.0012+0.0004*(S.props.length-1))); flow -= tax; addLog(`繳納 ${titleOf(p.L)} 房屋稅 ${NT(tax)} 元${p.status!=='自住'?(absOf(S.t)>=2024*12+6?'（非自住適用囤房稅2.0差別稅率，遊戲為簡化估算）':'（非自住適用較高稅率，遊戲為簡化估算）'):''}。`); }
    if (d.m===11){ const tax = Math.round(valueOf(p.L)*(p.status==='自住'?0.0003:0.0007)); flow -= tax; addLog(`繳納 ${titleOf(p.L)} 地價稅 ${NT(tax)} 元。`); }
    if (d.m===1 && S.t>0) p.L.age++;
    if (p.sale){
      if (S.t > p.sale.until){ addLog(`${titleOf(p.L)} 的${p.sale.label}委託到期，未成交。`); p.sale=null; if (p.status==='委售中') p.status='空置'; }
      else if (Math.random() < offerProb(p, p.sale.ask, p.sale.mode, p.sale.feePct)) offers.push(p);
    }
  }
  S.cash += flow;
  // market
  S.didx = S.didx || {};
  const aNow = absOf(S.t);
  const hr = histRate(aNow); const dRate = hr - (S.lastHistRate??hr); S.lastHistRate = hr;
  if (Math.abs(dRate)>0.0001) S.props.forEach(p=>p.loan&&(p.loan.rate=+(p.loan.rate+dRate).toFixed(3)));
  if (aNow >= NOW_ABS){
    for (const k in CITIES){ S.idx[k] *= 1 + CITIES[k].drift + R(-0.004,0.004); CITIES[k].dists.forEach((x,i)=>{ const dd=DIST_DRIFT[x[0]]; if (dd) S.didx[k+i]=(S.didx[k+i]||1)*(1+dd); }); }
    if (Math.random()<0.14) pick(EVENTS)();
    if (aNow===NOW_ABS) news('時間來到 2026 年 10 月，也就是本軟體製作完成的時間點。從現在起，房價、利率與新聞都是軟體隨機模擬推估，不代表真實未來，房價可能漲也可能跌，請勿當成投資依據。');
  }
  for (const [y,m,txt] of HNEWS){ const key=y*12+m; if (!S.newsDone[key] && y*12+m-1<=aNow){ S.newsDone[key]=1; news(`〔${y}/${String(m).padStart(2,'0')}〕${txt}`); } }
  if (d.m===1){ S.income=Math.round(S.income*1.012/100)*100; S.rentHome=Math.round(S.rentHome*1.01/100)*100; S.living=Math.round(S.living*1.012/100)*100; }
  // listings churn
  S.listings = S.listings.filter(l=>!(Math.random()<0.07 && !(l.nego && l.nego.agreed)));
  for (const k in CITIES) CITIES[k].dists.forEach((x,i)=>{ const n = S.listings.filter(l=>l.ck===k&&l.di===i).length; if (n<2 || (n<5 && Math.random()<0.25)) S.listings.push(genListing(k,i)); });
  S.listings.forEach(l=>{ if (l.nego && !l.nego.done) l.nego.mood = Math.min(PERS[l.seller.pers].mood, l.nego.mood+10); if (S.t-l.listedAt>4 && Math.random()<0.15){ l.ask=Math.round(l.ask*0.97/10000)*10000; if(l.nego) l.nego.lastAsk=Math.min(l.nego.lastAsk,l.ask); } });
  // cash crisis
  if (S.cash<0){ S.negCash++; addLog(`⚠️ 現金透支 ${W(-S.cash)} 萬！連續 3 個月將被迫拍賣房產。`); if (S.negCash>=3 && S.props.length){ const p = S.props.reduce((a,b)=>valueOf(a.L)>valueOf(b.L)?a:b); const price=Math.round(valueOf(p.L)*0.82); const e=saleEstimate(p,price,0); S.cash+=e.net; S.props=S.props.filter(x=>x!==p); addLog(`🔨 ${titleOf(p.L)} 遭法拍，以 ${W(price)} 萬賤價售出。`); S.negCash=0; } }
  else S.negCash=0;
  S.hist.push(netWorth()); if (S.hist.length>240) S.hist.shift();
  save(); render();
  offers.forEach(p=>queue.push(()=>saleOffer(p)));
  if (S.t===120) queue.push(()=>modal(`<h2>十年回顧</h2><p>你在房市打滾了十年，資產淨值來到 <b class="n" style="font-size:26px">${W(netWorth())} 萬</b>。${(()=>{const g=Math.max(50000000,(S.startCash||10000000)*3);return netWorth()>=g?`成功突破 ${W(g)} 萬，你已經從新手村畢業，成為房產達人！`:`離 ${W(g)} 萬目標還有一段距離，繼續努力！`;})()}</p><div class="foot"><button class="btn red" id="ok">繼續遊戲</button></div>`).querySelector('#ok').onclick=closeModal);
  if (queue.length && !$('#mw').classList.contains('open')) queue.shift()();
  toast(`${d.y}年${d.m}月　本月現金流 ${flow>=0?'+':''}${W1(flow)} 萬`);
}
