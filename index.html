    if (f && it.kind!=='me' && f.dataset.expr==='think' && !f.dataset.lockExpr) setExpr(f,'');
    f && f.classList.add('talk');
    const end = () => { f && f.classList.remove('talk'); finish(); };
    if (it.instant){ nar.querySelector('.tx').textContent = txt; end(); }
    else { sfx('blip'); typeInto(nar.querySelector('.tx'), txt, end); }
  };
  nar.addEventListener('click', ()=>{ const tx=nar.querySelector('.tx'); if (tx) {} });
  const push = (node, instant) => {
    if (!node || !node.classList || !node.classList.contains('msg')) return;
    const kind = node.classList.contains('me') ? 'me' : node.classList.contains('them') ? 'them' : 'sys';
    const offEl = node.querySelector('.off');
    const text = (node.firstChild && node.firstChild.nodeType===3 ? node.firstChild.textContent : node.textContent).trim();
    if (kind==='sys' && /正在思考|正在試算/.test(text)){ queue.push({kind:'think'}); run(); return; }
    if (!text && !offEl) return;
    queue.push({kind, text, off: offEl?offEl.textContent:'', instant}); run();
  };
  if (chat){
    const msgs = [...chat.querySelectorAll('.msg')];
    const lastOf = k => [...msgs].reverse().find(m=>m.classList.contains(k));
    [lastOf('them')].filter(Boolean).forEach(m=>push(m, true));
    new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>push(n,false)))).observe(chat, {childList:true});
  }
  if (!nar.classList.contains('show')){ nar.className='narr show sys'; nar.innerHTML = `<span class="who">📣 開始</span><span class="tx">${kind==='bank'?'銀行面談開始！說明你的條件，爭取更好的成數與利率。':kind==='sell'?'買方上門了！用屋況與條件說服他，記得誠實揭露。':'議價開始！先用話術探探口風，再找時機出價。'}</span><i class="cur">▼</i>`; }
}

const SFX = {on:(()=>{ try{ return localStorage.getItem('intern-sfx')!=='0'; }catch(e){ return true; } })(), ctx:null};
function sfx(name){
  if (!SFX.on) return;
  try{
    const C = SFX.ctx || (SFX.ctx = new (window.AudioContext||window.webkitAudioContext)());
    if (C.state==='suspended') C.resume();
    const t = C.currentTime;
    const tone = (f,d,type='sine',v=.08,delay=0,f2) => { const o=C.createOscillator(), g=C.createGain(); o.type=type; o.frequency.setValueAtTime(f,t+delay); if (f2) o.frequency.exponentialRampToValueAtTime(f2,t+delay+d); g.gain.setValueAtTime(v,t+delay); g.gain.exponentialRampToValueAtTime(.0001,t+delay+d); o.connect(g); g.connect(C.destination); o.start(t+delay); o.stop(t+delay+d+.03); };
    switch(name){
      case 'click': tone(660,.05,'triangle',.035); break;
      case 'blip': tone(480+Math.random()*160,.025,'square',.012); break;
      case 'coin': tone(988,.08,'square',.045); tone(1319,.28,'square',.045,.08); break;
      case 'stamp': tone(180,.07,'triangle',.09,0,120); tone(1047,.16,'sine',.05,.04); tone(1568,.3,'sine',.045,.11); break;
      case 'fail': tone(392,.16,'triangle',.06); tone(311,.18,'triangle',.06,.16); tone(262,.36,'triangle',.06,.32); break;
      case 'up': [523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.06,i*.1)); break;
      case 'down': tone(420,.14,'triangle',.05,0,300); break;
      case 'good': tone(660,.08,'triangle',.05); tone(880,.14,'triangle',.05,.07); break;
      case 'page': tone(260,.12,'triangle',.03,0,620); break;
      case 'ach': [784,988,1175,1568].forEach((f,i)=>tone(f,.22,'square',.03,i*.08)); break;
    }
  }catch(e){}
}
function setSfx(on){ SFX.on=on; try{ localStorage.setItem('intern-sfx', on?'1':'0'); }catch(e){} const b=$('#sfxBtn'); if (b) b.textContent = on?'🔊':'🔇'; if (on) sfx('good'); }

function confetti(n=140){
  try{ bgmJingle(); }catch(e){}
  if (REDUCE()) return;
  const cv = document.createElement('canvas'); cv.className='confetti'; document.body.appendChild(cv);
  const W = cv.width = innerWidth, H = cv.height = innerHeight, cx = cv.getContext('2d');
  const cols = ['#d7263d','#ffd23f','#2f5bd3','#17805a','#8a5cc7','#ff8a3d'];
  const ps = Array.from({length:n}, ()=>({x:W/2+(Math.random()-.5)*W*.5, y:H*.35, vx:(Math.random()-.5)*14, vy:-Math.random()*13-4, r:Math.random()*6+4, c:cols[(Math.random()*cols.length)|0], a:Math.random()*6, va:(Math.random()-.5)*.4}));
  let f = 0;
  const tick = () => { cx.clearRect(0,0,W,H); ps.forEach(p=>{ p.vy+=.38; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.va; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.a); cx.fillStyle=p.c; cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); cx.restore(); }); if (++f<110) requestAnimationFrame(tick); else cv.remove(); };

}

function tweenNum(el, to, fmt){
  if (!el) return; const from = el.dataset.v===undefined ? to : +el.dataset.v; el.dataset.v = to;
  if (from===to || REDUCE()){ el.textContent = fmt(to); return; }
  const t0 = performance.now(), dur = 700;
  el.classList.remove('bump-up','bump-down'); void el.offsetWidth; el.classList.add(to>from?'bump-up':'bump-down');
  const step = now => { const k = Math.min(1,(now-t0)/dur), e = 1-Math.pow(1-k,3); el.textContent = fmt(from+(to-from)*e); if (k<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

function bldgSVG(L, maxH){
  const h = hashN('b'+L.id), pick = (arr,k)=>arr[(h>>>k)%arr.length];
  const T = L.type, floors = T==='透天' ? L.total : T==='公寓' ? Math.min(5,L.total) : Math.min(T==='華廈'?10:16, L.total);
  const W = T==='電梯大樓' ? 84 : T==='華廈' ? 80 : T==='透天' ? 56 : 78;
  const D = T==='電梯大樓' ? 30 : T==='透天' ? 20 : 26, dx = D*0.62, dy = -D*0.36;
  const fh = Math.min(T==='電梯大樓'?11:T==='華廈'?14:24, (maxH-34)/floors);
  const bodyH = Math.round(floors*fh), cap = T==='電梯大樓'?18:T==='公寓'?20:T==='透天'?22:10;
  const top = cap - dy + 4, base = top + bodyH;            // 正面頂邊與底邊
  const uid = 'k'+(h%99999);
  const wall = T==='透天' ? pick(['#ecd8b8','#e2ccae','#f0dcc8','#d6dccd'],3) : T==='電梯大樓' ? pick(['#6f8fae','#7a9898','#8489a8','#647e98'],3) : T==='華廈' ? pick(['#e1d3bd','#d3c0a6','#e9dcc8','#cdd1c8'],3) : pick(['#dccbad','#cfae88','#e0cab8','#c5cdcf','#d8bda4'],3);
  const glass = T==='電梯大樓' ? ['#cfe9fb','#7fb4dc'] : ['#bfe0f4','#7aa9cc'];
  const wallSide = shadeC(wall,-.26), wallTop = shadeC(wall,.14);
  let s = `<defs>
    <linearGradient id="${uid}f" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${shadeC(wall,.08)}"/><stop offset=".7" stop-color="${wall}"/><stop offset="1" stop-color="${shadeC(wall,-.06)}"/></linearGradient>
    <linearGradient id="${uid}s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${shadeC(wallSide,.06)}"/><stop offset="1" stop-color="${shadeC(wallSide,-.12)}"/></linearGradient>
    <linearGradient id="${uid}g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${glass[0]}"/><stop offset=".45" stop-color="${glass[1]}"/><stop offset=".5" stop-color="#e8f6ff"/><stop offset=".56" stop-color="${glass[1]}"/><stop offset="1" stop-color="${shadeC(glass[1],-.2)}"/></linearGradient>
    <linearGradient id="${uid}w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe7a8"/><stop offset="1" stop-color="#ffc861"/></linearGradient>
  </defs>`;
  // 地面陰影
  s += `<path d="M${W} ${base} L${W+dx*2.1} ${base+dy*0.6} L${dx*2.1+W*0.35} ${base+dy*0.6+10} L0 ${base+3} Z" fill="rgba(20,20,40,.18)"/>`;
  // 側面＋頂面＋正面
  s += `<path d="M${W} ${top} L${W+dx} ${top+dy} L${W+dx} ${base+dy} L${W} ${base} Z" fill="url(#${uid}s)"/>`;
  s += `<path d="M0 ${top} L${dx} ${top+dy} L${W+dx} ${top+dy} L${W} ${top} Z" fill="${wallTop}"/>`;
  s += `<rect x="0" y="${top}" width="${W}" height="${bodyH}" fill="url(#${uid}f)"/>`;
  // 磁磚紋理（細線）
  if (T!=='電梯大樓') for (let y=top+4; y<base; y+=4) s += `<path d="M0 ${y} H${W}" stroke="${shadeC(wall,-.05)}" stroke-width=".4" opacity=".6"/>`;
  // 內凹窗（含窗台陰影與玻璃反光）
  const lit = k => ((h>>>(k%28))&7)===0;
  const win = (x,y,w,hh,k) => { hh=Math.max(2,hh); return `<rect x="${x-1.2}" y="${y-1.2}" width="${w+2.4}" height="${hh+2.4}" rx="1" fill="${shadeC(wall,-.35)}"/><rect x="${x}" y="${y}" width="${w}" height="${hh}" fill="${lit(k)?`url(#${uid}w)`:`url(#${uid}g)`}"/><path d="M${x} ${y} h${w} l-1.6 1.6 h${-(w-3.2)} v${hh-3.2} l-1.6 1.6 Z" fill="rgba(0,0,0,.22)"/><rect x="${x-1.6}" y="${y+hh}" width="${w+3.2}" height="1.8" fill="${shadeC(wall,.2)}"/>`; };
  const sideWin = (fy,hh) => { hh=Math.max(2,hh); const x1=W+dx*0.25, x2=W+dx*0.7; return `<path d="M${x1} ${fy+dy*0.25} L${x2} ${fy+dy*0.7} L${x2} ${fy+dy*0.7+hh} L${x1} ${fy+dy*0.25+hh} Z" fill="${shadeC(glass[1],-.25)}" opacity=".85"/>`; };
  if (T==='電梯大樓'){
    for (let f=0; f<floors; f++){ const y=top+3+f*fh; for (let k=0;k<4;k++) s += win(6+k*19.5, y, 14.5, fh-4.5, f*5+k); s += sideWin(y, fh-5); }
    s += `<rect x="${W*0.38}" y="${base-17}" width="${W*0.24}" height="17" fill="#2b3440"/><rect x="${W*0.38+2}" y="${base-15}" width="${W*0.24-4}" height="13" fill="url(#${uid}g)" opacity=".7"/><path d="M${W*0.3} ${base-19} h${W*0.4} v-3 h${-W*0.4} Z" fill="${shadeC(wall,-.4)}"/>`;
    // 頂部機房
    const cx=W*0.28, cw=W*0.44, ch=13, cd=D*0.5, cdx=cd*0.62, cdy=-cd*0.36, ct=top+dy*0.5-ch;
    s += `<path d="M${cx+cw} ${ct} L${cx+cw+cdx} ${ct+cdy} L${cx+cw+cdx} ${ct+cdy+ch} L${cx+cw} ${ct+ch} Z" fill="${shadeC(wall,-.4)}"/><path d="M${cx} ${ct} L${cx+cdx} ${ct+cdy} L${cx+cw+cdx} ${ct+cdy} L${cx+cw} ${ct} Z" fill="${shadeC(wall,.05)}"/><rect x="${cx}" y="${ct}" width="${cw}" height="${ch}" fill="${shadeC(wall,-.18)}"/>`;
    s += `<path d="M${cx+cw*0.7} ${ct+cdy} v-14" stroke="#555" stroke-width="2"/><circle cx="${cx+cw*0.7}" cy="${ct+cdy-15}" r="2.2" fill="#ff4d4d"/>`;
  } else if (T==='透天'){
    const gH = Math.min(fh*1.05, 26), gy = base-gH;
    for (let f=0; f<floors-1; f++){
      const y=top+4+f*fh, ww=W-16, wh=fh-11;
      s += win(8, y, ww, wh, f) + `<path d="M${W/2} ${y} v${wh}" stroke="${shadeC(wall,-.4)}" stroke-width="1.4"/>`;
      // 突出陽台（樓板＋欄杆，含側面）
      const by=y+wh+1.5, bd=6;
      s += `<path d="M2 ${by} L${2+bd*0.62} ${by-bd*0.36} L${W-2+bd*0.62} ${by-bd*0.36} L${W-2} ${by} Z" fill="${shadeC(wall,.1)}"/><rect x="2" y="${by}" width="${W-4}" height="3" fill="${shadeC(wall,-.25)}"/>`;
      s += `<path d="M2 ${by-8} H${W-2}" stroke="#3b3f4a" stroke-width="1.4"/>` + Array.from({length:9},(_,i)=>`<path d="M${4+i*((W-8)/8)} ${by-8} v8" stroke="#3b3f4a" stroke-width=".9"/>`).join('');
      if ((h>>>(f+5))%2) s += `<ellipse cx="11" cy="${by-10}" rx="3.6" ry="3.4" fill="#4f9a5a"/><ellipse cx="10" cy="${by-11.2}" rx="1.6" ry="1.4" fill="#7cc48a"/><path d="M8.5 ${by-7.5} h5 l-.8 3 h-3.4 Z" fill="#c0603a"/>`;
      s += sideWin(y+2, wh-4);
    }
    // 一樓鐵捲門＋門
    s += `<rect x="5" y="${gy}" width="${W*0.62}" height="${gH}" fill="#8f99a3"/>` + Array.from({length:Math.floor(gH/2.4)},(_,i)=>`<path d="M5 ${gy+1.2+i*2.4} h${W*0.62}" stroke="#6f7983" stroke-width=".8"/>`).join('') + `<rect x="5" y="${gy}" width="${W*0.62}" height="2.4" fill="rgba(0,0,0,.25)"/>`;
    s += `<rect x="${W*0.7}" y="${gy+2}" width="${W*0.24}" height="${gH-2}" fill="#6b4a30"/><circle cx="${W*0.9}" cy="${gy+gH*0.55}" r="1" fill="#f2c14e"/>`;
    s += `<path d="M-2 ${gy-1} L${W+2} ${gy-1} L${W+2+5} ${gy-6} L${3} ${gy-6} Z" fill="#a8443d"/><rect x="-2" y="${gy-1}" width="${W+4}" height="2.4" fill="#7a2f2a"/>`;
    // 頂樓加蓋鐵皮
    const rw=W*0.82, rx=W*0.05, rh=12, rt=top-rh+2;
    s += `<path d="M${rx+rw} ${rt} L${rx+rw+dx*0.8} ${rt+dy*0.8} L${rx+rw+dx*0.8} ${rt+dy*0.8+rh} L${rx+rw} ${rt+rh} Z" fill="#6f7b86"/><rect x="${rx}" y="${rt}" width="${rw}" height="${rh}" fill="#a3afba"/>` + Array.from({length:Math.floor(rw/4)},(_,i)=>`<path d="M${rx+2+i*4} ${rt} v${rh}" stroke="#8a96a1" stroke-width=".9"/>`).join('');
    s += `<path d="M${rx-3} ${rt} L${rx-3+dx} ${rt+dy-2} L${rx+rw+3+dx} ${rt+dy-2} L${rx+rw+3} ${rt} Z" fill="#7d8994"/><path d="M${rx-3} ${rt} h${rw+6}" stroke="#5a6570" stroke-width="1.4"/>`;
    s += `<rect x="${rx+rw*0.55}" y="${rt+dy-9}" width="15" height="8" rx="3.5" fill="#d9e2e8" stroke="#8a969f" stroke-width=".8"/>`;
    s += `<path d="M-1 ${top} h${W+2}" stroke="#a8443d" stroke-width="3.2"/>`;
  } else {
    for (let f=0; f<floors; f++){ const y=top+f*fh;
      s += `<path d="M0 ${y} H${W}" stroke="${shadeC(wall,-.18)}" stroke-width="1"/>`;
      if (f===floors-1 && T==='公寓'){ s += `<rect x="6" y="${y+3}" width="${W-12}" height="${Math.max(2,fh-5)}" fill="#7a8590"/>` + Array.from({length:8},(_,i)=>`<path d="M6 ${y+4+i*((fh-6)/8)} H${W-6}" stroke="#5f6a75" stroke-width=".9"/>`).join(''); continue; }
      for (let k=0;k<2;k++){ const x = 7+k*(W/2-1), ww=W/2-13, wh=fh-10;
        s += win(x, y+4, ww, wh, f*3+k);
        if (T==='公寓'){  s += `<rect x="${x-2}" y="${y+2.5}" width="${ww+4}" height="${Math.max(2,wh+3)}" fill="none" stroke="#4a4f58" stroke-width="1.1"/>` + Array.from({length:5},(_,i)=>`<path d="M${x+i*(ww/4)} ${y+2.5} v${wh+3}" stroke="#4a4f58" stroke-width=".9"/>`).join(''); }
        else s += `<path d="M${x-3} ${y+wh+5} h${ww+6} l2 -2.4 h${-(ww+6)} Z" fill="${shadeC(wall,.18)}"/>`;
      }
      if ((h>>>(f+2))%3===0) s += `<rect x="${W+dx*0.3}" y="${y+fh/2-3+dy*0.3}" width="8" height="7" fill="#f0f0f0" stroke="#999" stroke-width=".6"/>`;
      s += sideWin(y+4, fh-11);
    }
    if (T==='公寓') s += `<path d="M${W*0.55} ${top-14} h18 v14 h-18 Z" fill="#e8eef2" stroke="#9aa" stroke-width="1"/><path d="M${W*0.55+18} ${top-14} l5 -3 v14 l-5 3 Z" fill="#c4ccd2"/>`;
    s += `<path d="M-2 ${top} L${W+2} ${top} L${W+2+dx} ${top+dy} L${dx-2} ${top+dy} Z" fill="${shadeC(wall,-.08)}"/><rect x="-2" y="${top-1}" width="${W+4}" height="5" fill="${shadeC(wall,-.3)}"/>`;
    s += `<rect x="${W/2-10}" y="${base-14}" width="20" height="14" fill="#3a3530"/><rect x="${W/2-8}" y="${base-12}" width="16" height="12" fill="url(#${uid}g)" opacity=".55"/>`;
  }
  // 環境光遮蔽：牆腳暗帶
  s += `<rect x="0" y="${base-6}" width="${W}" height="6" fill="url(#${uid}ao)"/><defs><linearGradient id="${uid}ao" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".22"/></linearGradient></defs>`;
  const VW = W+dx+8, VH = base+12;
  return {svg:`<svg viewBox="-4 0 ${VW} ${VH}" width="${VW}" height="${VH}" aria-hidden="true">${s}</svg>`, w:VW, h:VH};
}

function farSky(){ let s='', x=0, i=0; while (x<1000){ const w=26+((i*41)%40), h=40+((i*67)%80), d=8; s+=`<path d="M${x+w} ${120-h} l${d} -5 v${h} l-${d} 5 Z" fill="#7a9ab6"/><path d="M${x} ${120-h} l${d} -5 h${w} l-${d} 5 Z" fill="#a9c4da"/><rect x="${x}" y="${120-h}" width="${w}" height="${h}" fill="#8fb1cc"/>`; for(let wy=120-h+6; wy<114; wy+=9) for(let wx=x+4; wx<x+w-4; wx+=7) if(((wx+wy+i)%4)===0) s+=`<rect x="${wx}" y="${wy}" width="3" height="4" fill="#cfe2f0"/>`; x+=w+12; i++; } return `<svg viewBox="0 -8 1000 128" preserveAspectRatio="none">${s}</svg>`; }
function streetHTML(ls, area){
  const day = dateOf(S.t).m;
  const trees = n => Array.from({length:n},(_,i)=>`<div class="tree" style="left:${8+i*(84/Math.max(1,n-1))}%"></div>`).join('');
  return `<div class="street" id="street">
    <div class="sky"></div><div class="far">${farSky()}</div>
    <div class="bldgs">${ls.map((L,i)=>{ const b=bldgSVG(L,150); const seen=S.seen[L.id]; return `<button class="bldg" type="button" data-walk="${L.id}" style="--i:${i}" title="${esc(L.road+' '+L.type)}">
        <span class="tagp">${W(L.ask)}<small>萬</small>${seen?'<i>✓</i>':''}</span>${b.svg}<span class="flag">${L.custom?'✏️':'售'}</span><span class="lbl">${esc(L.road.replace(/巷內$/,''))}</span></button>`; }).join('')||'<div class="nolist">這區暫時沒有待售物件</div>'}</div>
    <div class="sidewalk"></div><div class="road"><i></i></div>
    <div class="walker" id="walker">${meFig(64,true)}</div>
    <div class="scooter s1"></div><div class="scooter s2"></div>
    <div class="streetname">📍 ${esc(area)}</div>
  </div>`;
}
function walkTo(id){
  const st = $('#street'), w = $('#walker'), b = st && st.querySelector(`[data-walk="${id}"]`);
  if (!st || !w || !b || REDUCE()){ openListing(id); return; }
  const sr = st.getBoundingClientRect(), br = b.getBoundingClientRect();
  const x = br.left - sr.left + br.width/2 - 26;
  const cur = parseFloat(w.style.left)||16, dist = Math.abs(x-cur);
  w.style.transitionDuration = Math.min(1.1, .25+dist/700)+'s';
  w.classList.toggle('flip', x<cur); w.classList.add('walking'); w.style.left = x+'px'; sfx('click');
  setTimeout(()=>{ w.classList.remove('walking'); b.classList.add('knock'); setTimeout(()=>openListing(id), 220); }, Math.min(1100, 250+dist/0.7));
}

function pickTactic(md, b, text){
  const ta = md.querySelector('#say'); if (!ta) return;
  const was = b.classList.contains('sel');
  md.querySelectorAll('.cmdpane button.sel, .tact button.sel').forEach(x=>x.classList.remove('sel'));
  if (was && ta.value===ta.dataset.tac){ ta.value=''; ta.dataset.tac=''; ta.focus(); return; }
  ta.value = text; ta.dataset.tac = text; b.classList.add('sel'); ta.focus();
  if (!ta._tacBound){ ta._tacBound=1; ta.addEventListener('input', ()=>{ if (ta.value!==ta.dataset.tac) md.querySelectorAll('.cmdpane button.sel, .tact button.sel').forEach(x=>x.classList.remove('sel')); }); }
}

function applyFixed(L, items, pro){
  const fx = L.fixed; if (!fx) return items;
  return items.map(x=>{
    const v = fx[x.id]; if (!v || CUSTOM_ISSUE_MAP[x.id]) return x;

function auctionTick(){

    if (A.status!=='open') continue;
    if (A.round==='apply'){
      if (Math.random()<0.25){ A.status='sold'; A.hist.push({r:'應買', base:A.base, res:'他人應買'}); continue; }

    if (comps.length){ const top = comps.reduce((a,b)=>a.bid>b.bid?a:b); A.status='sold'; A.hist.push({r:ROUND_TAG[A.round], base:A.base, res:`由${top.label}以 ${W(top.bid)} 萬拍定`}); continue; }

    if (Math.random()<0.12){ A.status='sold'; A.hist.push({r:ROUND_TAG[A.round], base:A.base, res:'債權人聲明承受'}); continue; }
    if (A.round===3){ A.round='apply'; A.applyUntil=S.t+3; continue; }
    A.round++; A.base = Math.round(A.base*R(0.8,0.85)/10000)*10000; A.due = S.t+1;
  }

const ISO_C = 0.866, ISO_S = 0.5;
function isoP(o,x,y,z){ return [o.ox+(x-y)*ISO_C*o.u, o.oy+(x+y)*ISO_S*o.u - z*o.u]; }
const ipts = a => a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
const ipoly = (a,f,ex='') => `<polygon points="${ipts(a)}" fill="${f}" ${ex}/>`;
function ibox(o,x,y,z,w,d,h,c,opt={}){
  const t=[isoP(o,x,y,z+h),isoP(o,x+w,y,z+h),isoP(o,x+w,y+d,z+h),isoP(o,x,y+d,z+h)];
  const l=[isoP(o,x,y+d,z),isoP(o,x+w,y+d,z),isoP(o,x+w,y+d,z+h),isoP(o,x,y+d,z+h)];
  const r=[isoP(o,x+w,y,z),isoP(o,x+w,y+d,z),isoP(o,x+w,y+d,z+h),isoP(o,x+w,y,z+h)];
  let s = ipoly(l,shadeC(c,-.12))+ipoly(r,shadeC(c,-.28))+(opt.noTop?'':ipoly(t,opt.top||shadeC(c,.1)));

}

let LV_BACKUP = null;
function levelBaseL(D){
  const di = Math.max(0, CITIES[D.ck].dists.findIndex(d=>d[0]===D.dist));
  const L = genListing(D.ck, di);
  Object.assign(L, {type:D.type, ping:D.ping, age:D.age, floor:D.floor, total:D.total, parking:false, cond:D.cond, issues:[...(D.issues||[])], road:D.road, agent:!!D.agent, level:D.n, layout:0,
    rooms: D.ping<26?'2房1廳1衛':D.ping<36?'3房2廳1衛':D.ping<50?'3房2廳2衛':'4房2廳3衛'});
  if (D.fixed) L.fixed = {...D.fixed};
  return L;
}
function makeLevelListing(n){
  const D = levelDef(n), L = levelBaseL(D);
  const vRef = D.trap ? valueOf({...L, issues:L.issues.filter(x=>!/海砂/.test(x))}) : valueOf(L);
  L.ask = Math.round(vRef*D.askF/10000)*10000;
  if (D.pers){ L.seller.pers = D.pers; L.seller.name = D.sellerName; L.seller.resF = (L.ask*(D.resAsk||0.92))/valueOf(L); if (D.mood) L.seller.mood = D.mood; }
  L.report = (D.report||[]).length ? inspectReport(L).filter(x=>D.report.includes(x.id) && x.st!=='ok') : null;
  if (L.report) L.reportT = S.t+'-'+L.cond;
  S.seen[L.id] = {t:S.t, res:(L.report||[]).filter(x=>x.st==='bad').map(x=>({id:x.id, st:'bad'}))};
  S.listings = S.listings.filter(x=>!x.level);
  S.listings.push(L);
  return L;
}

}

  const items = [['🎵','音樂與音效',()=>{ if (BGM.on) bgmStart(); bgmPanel(); }],['✏️','自訂案件',()=>$('#customBtn').click()],['🏅','成就',()=>$('#achBtn').click()],['👤','我的角色',()=>$('#avatarBtn').click()],['📖','小辭典',()=>$('#glossBtn').click()],['🔄','重新開始',()=>$('#restart').click()],['📜','免責聲明',()=>showDisclaimer()]];

  d.innerHTML = `<div class="ms" role="dialog" aria-label="更多功能"><div class="msh"></div><div class="msg">${items.map(([ic,t],i)=>`<button type="button" data-mi="${i}"><span>${ic}</span>${t}</button>`).join('')}</div></div>`;
  document.body.appendChild(d); sfx('click');
  d.onclick = e => { const b = e.target.closest('[data-mi]'); if (b){ d.remove(); setTimeout(()=>items[+b.dataset.mi][2](), 30); } else if (e.target===d) d.remove(); };
}; $('#sfxBtn').textContent = SFX.on?'🔊':'🔇';
document.addEventListener('click', e=>{ if (e.target.closest && e.target.closest('.btn, .lc, .chip, .seg button, .mode')) sfx('click'); }, true);
if (!load()) newGame();
render();
document.addEventListener('click', e=>{ const b = e.target.closest && e.target.closest('[data-walk]'); if (b){ e.preventDefault(); walkTo(b.dataset.walk); } });
titleScreen();
})();
</script>
</body>
</html>
